name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-24.04

    steps:
      - name: Branch Governance
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          decision=blocked

          case "$base" in
            main)
              if [[ "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                decision=allowed
              fi
              ;;
            develop)
              if [[ "$head" =~ ^feature/.+ || "$head" =~ ^dependabot/.+ || "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" == "main" ]]; then
                decision=allowed
              fi
              ;;
          esac

          echo "Branch governance decision: $decision (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != "allowed" ]]; then
            echo "Pull requests to main must come from release/v* or hotfix/v*; pull requests to develop must come from feature/*, dependabot/*, release/v*, hotfix/v*, or main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package
