name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  merge_group:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-24.04

    steps:
      - name: Branch Governance
        if: ${{ github.event_name == 'pull_request' }}
        # Pass the PR refs through env, not inline `${{ }}`, so an attacker-
        # controlled branch name (github.head_ref) cannot inject shell commands.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          base="$BASE_REF"
          head="$HEAD_REF"
          decision=blocked

          # fix/* branches must merge into a feature/* branch, never directly
          # into develop or main. Reject early with a targeted message.
          if [[ "$head" =~ ^fix/.+ && ( "$base" == "develop" || "$base" == "main" ) ]]; then
            echo "Branch governance decision: blocked (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fix/* branches must merge into a feature/* branch, not '$base'. Flow: fix/* -> feature/<issue#>-... -> develop -> main." >&2
            exit 1
          fi

          case "$base" in
            main)
              if [[ "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                decision=allowed
              fi
              ;;
            develop)
              # Dependabot opens PRs against develop per .github/dependabot.yml, so
              # the dependabot/* family is allowed to target develop alongside the
              # normal GitFlow heads. These remain gated by the full CI suite below.
              if [[ "$head" =~ ^feature/[0-9]+-.+ || "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" == "main" || "$head" =~ ^dependabot/.+ ]]; then
                decision=allowed
              fi
              ;;
            feature/*)
              # fix/* and stacked feature/<issue#>-* branches may target a feature branch.
              if [[ "$head" =~ ^fix/.+ || "$head" =~ ^feature/[0-9]+-.+ ]]; then
                decision=allowed
              fi
              ;;
          esac

          echo "Branch governance decision: $decision (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != "allowed" ]]; then
            echo "Branch policy: PRs to main must come from release/v* or hotfix/v*; PRs to develop must come from feature/<issue#>-*, release/v*, hotfix/v*, main, or dependabot/*; PRs to a feature/* branch must come from fix/* or feature/<issue#>-*. feature/* branches must reference an issue (feature/<issue#>-...)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Customization Audit
        run: |
          set +e
          npm run customization:audit
          audit_status=$?
          node scripts/auditCustomizationGovernance.js --json > customization-audit-report.json
          exit $audit_status

      - name: Customization Audit Report / custom-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: customization-audit-report-${{ github.run_id }}
          path: customization-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Traceability Audit
        run: |
          set +e
          set -o pipefail
          npm run traceability:audit | tee traceability-audit-report.txt
          traceability_status=${PIPESTATUS[0]}
          exit $traceability_status

      - name: Docs Link Check / lychee
        run: npm run docs:links

      - name: Documentation Gate / docs-gate
        run: npm run docs:gate

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare lvkit + icon-editor corpus (VHS-REQ-712)
        shell: bash
        run: |
          set -euo pipefail
          # Pin lvkit to an exact version so the committed lvkitRealIntegration
          # snapshots stay stable across upstream releases: install it as a uv
          # tool and expose the pinned executable via VIHS_LVKIT_BIN (the compare
          # provider's highest-priority resolution) rather than the unpinned
          # 'uvx --from lvkit lvkit' fallback.
          uv tool install 'lvkit==0.5.0'
          echo "VIHS_LVKIT_BIN=$HOME/.local/bin/lvkit" >> "$GITHUB_ENV"
          "$HOME/.local/bin/lvkit" --version
          # Minimal corpus: the two pinned icon-editor commits' VI blobs (the lvkit
          # diff is search-path independent, so no working-tree checkout is needed).
          corpus="$RUNNER_TEMP/lvkit-corpus"
          rm -rf "$corpus"
          git init -q "$corpus"
          git -C "$corpus" remote add origin https://github.com/ni/labview-icon-editor
          git -C "$corpus" fetch --depth 1 origin 537683398d8c5cb73533603b5c06b6eef62a6ac8
          git -C "$corpus" fetch --depth 1 origin fc09736ae5e38c2016de081a9c8686256c9f2f9c
          echo "VIHS_LVKIT_CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Test
        run: npm test

      - name: PR Coverage Gate / coverage
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage-${{ github.run_id }}
          path: |
            coverage/cobertura-coverage.xml
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Coverage Risk Gate / coverage-risk
        run: npm run coverage:map:enforce

      - name: Package
        run: npm run package

      # Advisory supply-chain provenance report (VHS-REQ-668): render the unified
      # read-model on every develop/PR build so provenance drift (a stale box,
      # runtime, or requirements binding) is visible early, long before the
      # marketplace-release gate would hard-block it. This is advisory only — it
      # runs WITHOUT --strict, so it never fails the build; the retained JSON/
      # Markdown lets a reviewer see the exact provenance state for a commit.
      - name: Supply-Chain Provenance Report / supply-chain-state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node scripts/buildSupplyChainState.js | tee supply-chain-state-report.txt
          node scripts/buildSupplyChainState.js --json --output supply-chain-state.json
          node scripts/buildSupplyChainState.js --markdown --output supply-chain-state.md

      - name: Supply-Chain Provenance Artifact / supply-chain-state
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-state-${{ github.run_id }}
          path: |
            supply-chain-state-report.txt
            supply-chain-state.json
            supply-chain-state.md
          if-no-files-found: ignore
          retention-days: 30

      - name: DoD Gate / dod
        run: |
          set +e
          set -o pipefail
          npm run dod:gate | tee dod-gate-report.txt
          dod_status=${PIPESTATUS[0]}
          exit $dod_status

      - name: Governance Gate Reports / governance-gates
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: governance-gate-reports-${{ github.run_id }}
          path: |
            traceability-audit-report.txt
            dod-gate-report.txt
          if-no-files-found: ignore
          retention-days: 30

      # Ephemeral requirements-manifest artifact (VHS-REQ-601): the manifest is
      # generated under out/ by `npm run package` (compile), so it also ships in
      # the VSIX. Uploading it here lets a future agent download the exact
      # requirements set for a commit without waiting on a Marketplace release.
      - name: Requirements Manifest / requirements-manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: requirements-manifest-${{ github.run_id }}
          path: |
            out/requirements/requirements-manifest.json
            out/requirements/requirements-manifest.md
          if-no-files-found: ignore
          retention-days: 30

  windows-unit-test:
    name: Windows Unit Tests
    runs-on: windows-latest

    steps:
      # Lightweight Windows leg (VHS-REQ-597): runs the same fast unit checks as
      # the required Ubuntu gate so platform-specific regressions (for example
      # path-separator assumptions in staging tests) fail closed in CI. It does
      # not duplicate branch governance, packaging, coverage upload, or the
      # governance gates, and it does not exercise the heavier Windows/LabVIEW
      # integration path, which stays maintainer-dispatch.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare lvkit + icon-editor corpus (VHS-REQ-712)
        shell: bash
        run: |
          set -euo pipefail
          # Pin lvkit to an exact version so the committed lvkitRealIntegration
          # snapshots stay stable across upstream releases: install it as a uv
          # tool and expose the pinned executable via VIHS_LVKIT_BIN (the compare
          # provider's highest-priority resolution) rather than the unpinned
          # 'uvx --from lvkit lvkit' fallback.
          uv tool install 'lvkit==0.5.0'
          echo "VIHS_LVKIT_BIN=$HOME/.local/bin/lvkit" >> "$GITHUB_ENV"
          "$HOME/.local/bin/lvkit" --version
          # Minimal corpus: the two pinned icon-editor commits' VI blobs (the lvkit
          # diff is search-path independent, so no working-tree checkout is needed).
          corpus="$RUNNER_TEMP/lvkit-corpus"
          rm -rf "$corpus"
          git init -q "$corpus"
          git -C "$corpus" remote add origin https://github.com/ni/labview-icon-editor
          git -C "$corpus" fetch --depth 1 origin 537683398d8c5cb73533603b5c06b6eef62a6ac8
          git -C "$corpus" fetch --depth 1 origin fc09736ae5e38c2016de081a9c8686256c9f2f9c
          echo "VIHS_LVKIT_CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Test
        run: npm test

  integration-host:
    name: Integration Host (Linux)
    runs-on: ubuntu-24.04

    steps:
      # Hosted VS Code extension-host integration leg (VHS-REQ-597): exercises
      # activation, eligibility indexing, command registration, panel render,
      # and the runtime-settings CLI on a real downloaded VS Code under xvfb.
      # The suite is LabVIEW-free (synthetic VI fixtures; LabVIEW-path
      # assertions self-skip) and does not run Docker or a real compare, so it
      # is a behavioral floor under the command/activation layer without
      # requiring the maintainer-dispatch Windows/LabVIEW runner. Coverage is
      # not collected here; it runs in Electron, outside the vitest run.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bootstrap Linux VS Code host
        run: npm run public:host:bootstrap-linux install

      - name: Integration Host (Linux)
        run: npm run test:integration:linux

  requirements-csv-integrity:
    name: Requirements CSV Integrity
    runs-on: ubuntu-24.04

    steps:
      # Requirements-contract integrity leg (VHS-REQ-601). The requirements CSVs
      # are parsed by mapping fields onto their headers by index, so a row with
      # an unescaped comma in an unquoted field silently drops columns and shifts
      # later fields (for example, a truncated Notes value) without failing any
      # other gate. The cross-reference guard additionally fails closed on a
      # dangling id-index anchor, an RTM ParentID that is not an Active system
      # requirement, an inventory Path that no longer exists, an id-index
      # ReplacementID that does not resolve, an SRS block whose references
      # disagree with the RTM evidence map, an Active system requirement whose
      # Verification References are absent or do not resolve, or an Active
      # requirement that declares no Verification Reference. Both guards print
      # their enforced contract to the run summary so the requirements are
      # front-facing on every pull request. The verification-linkage guard
      # additionally fails closed (in --enforce mode) when an Active requirement's
      # verification-reference tests do not cite its ID. The criterion-inventory
      # guard then fails closed (in --enforce mode) when an Active acceptance
      # criterion is not cited at the criterion level (VHS-REQ-NNN.M). They need
      # no dependency install; all use only Node built-ins (plus the sibling
      # audit and docs-link modules).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate requirements CSV column integrity
        run: node scripts/checkRequirementsCsvColumns.js

      - name: Validate requirements cross-references
        run: node scripts/checkRequirementsIntegrity.js

      - name: Enforce requirement verification linkage
        run: node scripts/auditRequirementVerificationLinkage.js --enforce

      - name: Enforce requirement criterion citation
        run: node scripts/auditRequirementCriteriaInventory.js --enforce
