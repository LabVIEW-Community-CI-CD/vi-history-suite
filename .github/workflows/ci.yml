name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'copilot/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-24.04

    steps:
      - name: Branch Governance
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          decision=blocked

          case "$base" in
            main)
              if [[ "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                decision=allowed
              fi
              ;;
            develop)
              if [[ "$head" =~ ^feature/.+ || "$head" =~ ^copilot/.+ || "$head" =~ ^dependabot/.+ || "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" == "main" ]]; then
                decision=allowed
              fi
              ;;
          esac

          echo "Branch governance decision: $decision (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != "allowed" ]]; then
            echo "Pull requests to main must come from release/v* or hotfix/v*; pull requests to develop must come from feature/*, copilot/*, dependabot/*, release/v*, hotfix/v*, or main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Customization Audit
        run: |
          set +e
          npm run customization:audit
          audit_status=$?
          node scripts/auditCustomizationGovernance.js --json > customization-audit-report.json
          exit $audit_status

      - name: Customization Audit Report / custom-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: customization-audit-report-${{ github.run_id }}
          path: customization-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Traceability Audit
        run: npm run traceability:audit

      - name: Docs Link Check / lychee
        run: npm run docs:links

      - name: Test
        run: npm test

      - name: PR Coverage Gate / coverage
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage-${{ github.run_id }}
          path: |
            coverage/cobertura-coverage.xml
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Package
        run: npm run package

      - name: DoD Gate / dod
        run: npm run dod:gate
