name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-24.04

    steps:
      - name: Branch Governance
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          decision=blocked

          # fix/* branches must merge into a feature/* branch, never directly
          # into develop or main. Reject early with a targeted message.
          if [[ "$head" =~ ^fix/.+ && ( "$base" == "develop" || "$base" == "main" ) ]]; then
            echo "Branch governance decision: blocked (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fix/* branches must merge into a feature/* branch, not '$base'. Flow: fix/* -> feature/<issue#>-... -> develop -> main." >&2
            exit 1
          fi

          case "$base" in
            main)
              if [[ "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                decision=allowed
              fi
              ;;
            develop)
              # Dependabot opens PRs against develop per .github/dependabot.yml, so
              # the dependabot/* family is allowed to target develop alongside the
              # normal GitFlow heads. These remain gated by the full CI suite below.
              if [[ "$head" =~ ^feature/[0-9]+-.+ || "$head" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+$ || "$head" == "main" || "$head" =~ ^dependabot/.+ ]]; then
                decision=allowed
              fi
              ;;
            feature/*)
              # fix/* and stacked feature/<issue#>-* branches may target a feature branch.
              if [[ "$head" =~ ^fix/.+ || "$head" =~ ^feature/[0-9]+-.+ ]]; then
                decision=allowed
              fi
              ;;
          esac

          echo "Branch governance decision: $decision (base=$base, head=$head)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != "allowed" ]]; then
            echo "Branch policy: PRs to main must come from release/v* or hotfix/v*; PRs to develop must come from feature/<issue#>-*, release/v*, hotfix/v*, main, or dependabot/*; PRs to a feature/* branch must come from fix/* or feature/<issue#>-*. feature/* branches must reference an issue (feature/<issue#>-...)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Customization Audit
        run: |
          set +e
          npm run customization:audit
          audit_status=$?
          node scripts/auditCustomizationGovernance.js --json > customization-audit-report.json
          exit $audit_status

      - name: Customization Audit Report / custom-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: customization-audit-report-${{ github.run_id }}
          path: customization-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Traceability Audit
        run: |
          set +e
          set -o pipefail
          npm run traceability:audit | tee traceability-audit-report.txt
          traceability_status=${PIPESTATUS[0]}
          exit $traceability_status

      - name: Docs Link Check / lychee
        run: npm run docs:links

      - name: Test
        run: npm test

      - name: PR Coverage Gate / coverage
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage-${{ github.run_id }}
          path: |
            coverage/cobertura-coverage.xml
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Package
        run: npm run package

      - name: DoD Gate / dod
        run: |
          set +e
          set -o pipefail
          npm run dod:gate | tee dod-gate-report.txt
          dod_status=${PIPESTATUS[0]}
          exit $dod_status

      - name: Governance Gate Reports / governance-gates
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: governance-gate-reports-${{ github.run_id }}
          path: |
            traceability-audit-report.txt
            dod-gate-report.txt
          if-no-files-found: ignore
          retention-days: 30

  windows-unit-test:
    name: Windows Unit Tests
    runs-on: windows-latest

    steps:
      # Lightweight Windows leg (VHS-REQ-597): runs the same fast unit checks as
      # the required Ubuntu gate so platform-specific regressions (for example
      # path-separator assumptions in staging tests) fail closed in CI. It does
      # not duplicate branch governance, packaging, coverage upload, or the
      # governance gates, and it does not exercise the heavier Windows/LabVIEW
      # integration path, which stays maintainer-dispatch.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

  integration-host:
    name: Integration Host (Linux)
    runs-on: ubuntu-24.04

    steps:
      # Hosted VS Code extension-host integration leg (VHS-REQ-597): exercises
      # activation, eligibility indexing, command registration, panel render,
      # and the runtime-settings CLI on a real downloaded VS Code under xvfb.
      # The suite is LabVIEW-free (synthetic VI fixtures; LabVIEW-path
      # assertions self-skip) and does not run Docker or a real compare, so it
      # is a behavioral floor under the command/activation layer without
      # requiring the maintainer-dispatch Windows/LabVIEW runner. Coverage is
      # not collected here; it runs in Electron, outside the vitest run.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bootstrap Linux VS Code host
        run: npm run public:host:bootstrap-linux install

      - name: Integration Host (Linux)
        run: npm run test:integration:linux
