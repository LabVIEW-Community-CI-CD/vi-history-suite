name: VI Semantic PR Review (callable)

# Reusable VI semantic PR-review unit (VHS-REQ-661). Any repository can run the
# LabVIEW "what changed" review of a pull request and post it as a sticky comment
# by adding a thin caller workflow:
#
#   jobs:
#     review:
#       uses: LabVIEW-Community-CI-CD/vi-history-suite/.github/workflows/vi-semantic-pr-review-callable.yml@<ref>
#       with:
#         repository: <owner/repo>
#         pr_number: '<n>'
#         enforce_trusted_ref: false   # external callers rely on their own protections
#       secrets:
#         VI_REVIEW_TARGET_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
#
# The caller must provide a self-hosted Linux runner labeled
# `vihs-linux-labview-docker` with docker and the NI LabVIEW image, and a token
# with `pull-requests: write` on the target repository.

on:
  workflow_call:
    inputs:
      repository:
        description: 'Target repository (owner/repo) whose pull request should be reviewed.'
        required: true
        type: string
      pr_number:
        description: 'Pull request number in the target repository to review.'
        required: true
        type: string
      container_image_version:
        description: 'NI LabVIEW container image version (e.g. 2026q1). The -linux tag is derived.'
        required: false
        default: '2026q1'
        type: string
      enforce_trusted_ref:
        description: 'Fail closed unless the caller ref is a trusted vi-history-suite ref (main/develop/release/tag). External consumers should pass false and rely on their own branch protections.'
        required: false
        default: true
        type: boolean
    secrets:
      VI_REVIEW_TARGET_TOKEN:
        description: 'Token with pull-requests: write on the target repository. Posted cross-repo, so the workflow GITHUB_TOKEN is insufficient.'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vi-semantic-pr-review:
    name: VI Semantic PR Review
    runs-on: [self-hosted, Linux, X64, vihs-linux-labview-docker]
    timeout-minutes: 90

    steps:
      - name: Guard Trusted Ref
        if: ${{ inputs.enforce_trusted_ref }}
        run: |
          # Running untrusted target-repo VIs inside a privileged LabVIEW
          # container and posting with a cross-repo token must only ever happen
          # from a trusted vi-history-suite ref. Fail closed otherwise so the
          # privileged VI_REVIEW_TARGET_TOKEN can never be exercised from an
          # untrusted branch. External consumers set enforce_trusted_ref=false
          # and rely on their own repository's branch protections instead.
          is_main=false
          is_develop=false
          is_release_branch=false
          is_exact_version_tag=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then is_main=true; fi
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then is_develop=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_release_branch=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_exact_version_tag=true; fi
          is_trusted_ref=false
          if [ "$is_main" = true ] || [ "$is_develop" = true ] || [ "$is_release_branch" = true ] || [ "$is_exact_version_tag" = true ]; then
            is_trusted_ref=true
          fi
          echo "Trusted ref decision: $is_trusted_ref (main=$is_main, develop=$is_develop, releaseBranch=$is_release_branch, exactVersionTag=$is_exact_version_tag, ref=$GITHUB_REF)"
          if [ "$is_trusted_ref" != true ]; then
            echo "This review workflow only accepts main, develop, release/v* branches, or exact v* release tags. Ref was: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Resolve tool checkout ref
        id: toolref
        env:
          # Pin the tool checkout to the commit SHA of the reusable workflow
          # file that defines this job, so a cross-repo caller gets the CLI at
          # the version it pinned, not vi-history-suite's default branch. In a
          # reusable workflow the `github` context reflects the CALLER, so
          # github.workflow_sha would be the caller's SHA; the `job` context's
          # workflow_* properties are the called (this) workflow's own identity.
          # Fail closed if the SHA is unavailable (e.g. GitHub Enterprise Server,
          # where job.workflow_* is not provided) rather than silently checking
          # out the default branch and running a different CLI than invoked.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "Could not resolve the reusable-workflow commit SHA (job.workflow_sha was empty); refusing to fall back to the default branch." >&2
            exit 1
          fi
          echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinning tool checkout to ${{ job.workflow_repository }}@$WORKFLOW_SHA"

      - name: Checkout vi-history-suite
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.toolref.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Runner Prerequisites
        env:
          CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
        run: |
          # Fail fast with an actionable message if docker or the NI LabVIEW
          # container image is missing, instead of dying deep in the review
          # step. The comparison runs the nationalinstruments/labview image.
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is required on this self-hosted runner but was not found on PATH." >&2
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "docker is installed but the daemon is not reachable (is dockerd running and is the runner user in the docker group?)." >&2
            exit 1
          fi
          image="nationalinstruments/labview:${CONTAINER_IMAGE_VERSION}-linux"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "Required NI LabVIEW container image '$image' is not available locally. Pull it on the runner: docker pull $image" >&2
            exit 1
          fi
          echo "docker and NI LabVIEW image '$image' are present."

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Clone Target Repository And Resolve Range
        env:
          GH_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Clone the target repository (never checked out into the trusted
          # workspace tree) and resolve the review range from the PR: head is
          # the PR head commit, base is the merge-base with the PR base branch.
          rm -rf target-clone
          gh repo clone "$TARGET_REPOSITORY" target-clone -- --no-single-branch
          expected_head="$(gh pr view "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          base_ref="$(gh pr view "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY" --json baseRefName --jq '.baseRefName')"
          # Fetch the head via the canonical refs/pull/<n>/head ref, which the
          # BASE repo always serves — including for fork PRs whose head commit
          # is not directly fetchable by bare SHA from origin on some server
          # configs / older git. Resolve the head from that ref rather than
          # trusting the SHA is directly reachable.
          git -C target-clone fetch --no-tags origin "refs/pull/$TARGET_PR_NUMBER/head" "$base_ref"
          head_sha="$(git -C target-clone rev-parse FETCH_HEAD)"
          # Cross-check the fetched tip against the API's headRefOid; if they
          # disagree (e.g. a force-push raced the dispatch), fail closed rather
          # than reviewing an unexpected commit.
          if [ "$head_sha" != "$expected_head" ]; then
            echo "PR head mismatch: refs/pull/$TARGET_PR_NUMBER/head resolved to $head_sha but the API reported $expected_head (force-push race?); refusing to review an unexpected commit." >&2
            exit 1
          fi
          merge_base="$(git -C target-clone merge-base "origin/$base_ref" "$head_sha")"
          echo "Target PR head: $head_sha"
          echo "Target PR base ref: $base_ref"
          echo "Resolved merge base: $merge_base"
          echo "REVIEW_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "REVIEW_MERGE_BASE=$merge_base" >> "$GITHUB_ENV"

      - name: Run VI Semantic PR Review And Post Sticky Comment
        env:
          GH_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
          CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
        run: |
          # The docker comparison bind-mounts its staging directory into the
          # LabVIEW container. snap-packaged Docker runs in a private mount
          # namespace with its own /tmp, so a staging directory under the
          # default /tmp is invisible inside the container and the compare fails
          # with "VI path invalid or does not exist". Point the CLI's temp root
          # at a directory under the runner workspace ($RUNNER_TEMP lives under
          # the runner home), which snap Docker can bind-mount, so staging is
          # visible in the container on both snap and native Docker hosts.
          review_tmp="$RUNNER_TEMP/vi-semantic-pr-review-staging"
          mkdir -p "$review_tmp"
          export TMPDIR="$review_tmp"
          # Pass the canonical <version>-linux tag: the runtime locator parses a
          # full container tag and silently falls back to the default image for a
          # bare version, which would run the wrong image for a non-default
          # container_image_version even though the prerequisite step validated
          # the requested one.
          node out/cli/runViSemanticPrReview.js \
            --repository-root target-clone \
            --base "$REVIEW_MERGE_BASE" --head "$REVIEW_HEAD_SHA" \
            --runtime-provider docker --container-image-version "${CONTAINER_IMAGE_VERSION}-linux" \
            --out review-out \
            --post-comment --pr "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY"

      - name: Upload Review Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vi-semantic-pr-review-${{ github.run_id }}
          path: review-out/**
          if-no-files-found: warn
          retention-days: 14
