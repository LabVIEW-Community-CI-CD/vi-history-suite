name: VI Semantic PR Review (callable)

# Reusable VI semantic PR-review unit (VHS-REQ-661). Any repository can run the
# LabVIEW "what changed" review of a pull request and post it as a sticky comment
# by adding a thin caller workflow:
#
#   jobs:
#     review:
#       uses: LabVIEW-Community-CI-CD/vi-history-suite/.github/workflows/vi-semantic-pr-review-callable.yml@<ref>
#       with:
#         repository: <owner/repo>
#         pr_number: '<n>'
#         enforce_trusted_ref: false   # external callers rely on their own protections
#       secrets:
#         VI_REVIEW_TARGET_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
#
# The job runs on a GitHub-hosted `ubuntu-latest` runner and pulls the NI
# LabVIEW image itself, so a caller only needs a token with
# `pull-requests: write` on the target repository.

on:
  workflow_call:
    inputs:
      repository:
        description: 'Target repository (owner/repo) whose pull request should be reviewed.'
        required: true
        type: string
      pr_number:
        description: 'Pull request number in the target repository to review.'
        required: true
        type: string
      container_image_version:
        description: 'NI LabVIEW container image version (e.g. 2026q1). The -linux tag is derived.'
        required: false
        default: '2026q1'
        type: string
      enforce_trusted_ref:
        description: 'Fail closed unless the caller ref is a trusted vi-history-suite ref (main/develop/release/tag). External consumers should pass false and rely on their own branch protections.'
        required: false
        default: true
        type: boolean
      publish_images:
        description: 'Upload each changed VI''s overview difference images to an assets branch and embed them inline in the review comment. Requires the token to also have contents: write on the target repository; a hosting failure is best-effort and never blocks the textual review.'
        required: false
        default: false
        type: boolean
      create_commit_status:
        description: 'Post a "VI Semantic Review" commit status on the PR head commit (a gateable status). Requires the token to also have statuses: write on the target repository; best-effort.'
        required: false
        default: false
        type: boolean
      correlate_previews:
        description: 'Attach the deterministic preview⇄comparison correlation (VHS-REQ-703) to the review by peeking the preview cache. Uses preview_cache_dir when non-empty; otherwise, when auto_warm_changed_previews is true, the changed VIs are warmed into a temporary cache first. With neither, correlation warns and skips (non-fatal). A cache-only peek launches no runtime, and a cache miss is reported honestly as an unavailable preview. Off by default.'
        required: false
        default: false
        type: boolean
      preview_cache_dir:
        description: 'Filesystem path readable by the review job (e.g. under the runner workspace or $RUNNER_TEMP) to a content-addressed preview cache to peek for correlation (VHS-REQ-703.4), e.g. the output of the preview-cache warm fabric (VHS-REQ-671). Used when correlate_previews is true and this path is non-empty; when empty, correlation falls back to auto_warm_changed_previews (if enabled) or skips.'
        required: false
        default: ''
        type: string
      auto_warm_changed_previews:
        description: 'When correlate_previews is true and preview_cache_dir is empty, render the previews of the VIs changed in the PR into a temporary cache first so the correlation gets a head-side hit (VHS-REQ-703.6). Adds a bounded LabVIEW render per changed VI (proportional to the comparison the review already runs). Off by default.'
        required: false
        default: false
        type: boolean
    secrets:
      VI_REVIEW_TARGET_TOKEN:
        description: 'Token with pull-requests: write on the target repository. Posted cross-repo, so the workflow GITHUB_TOKEN is insufficient.'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vi-semantic-pr-review:
    name: VI Semantic PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Guard Trusted Ref
        if: ${{ inputs.enforce_trusted_ref }}
        run: |
          # Running untrusted target-repo VIs inside a privileged LabVIEW
          # container and posting with a cross-repo token must only ever happen
          # from a trusted vi-history-suite ref. Fail closed otherwise so the
          # privileged VI_REVIEW_TARGET_TOKEN can never be exercised from an
          # untrusted branch. External consumers set enforce_trusted_ref=false
          # and rely on their own repository's branch protections instead.
          is_main=false
          is_develop=false
          is_release_branch=false
          is_exact_version_tag=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then is_main=true; fi
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then is_develop=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_release_branch=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_exact_version_tag=true; fi
          is_trusted_ref=false
          if [ "$is_main" = true ] || [ "$is_develop" = true ] || [ "$is_release_branch" = true ] || [ "$is_exact_version_tag" = true ]; then
            is_trusted_ref=true
          fi
          echo "Trusted ref decision: $is_trusted_ref (main=$is_main, develop=$is_develop, releaseBranch=$is_release_branch, exactVersionTag=$is_exact_version_tag, ref=$GITHUB_REF)"
          if [ "$is_trusted_ref" != true ]; then
            echo "This review workflow only accepts main, develop, release/v* branches, or exact v* release tags. Ref was: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Resolve tool checkout ref
        id: toolref
        env:
          # Pin the tool checkout to the commit SHA of the reusable workflow
          # file that defines this job, so a cross-repo caller gets the CLI at
          # the version it pinned, not vi-history-suite's default branch. In a
          # reusable workflow the `github` context reflects the CALLER, so
          # github.workflow_sha would be the caller's SHA; the `job` context's
          # workflow_* properties are the called (this) workflow's own identity.
          # Fail closed if the SHA is unavailable (e.g. GitHub Enterprise Server,
          # where job.workflow_* is not provided) rather than silently checking
          # out the default branch and running a different CLI than invoked.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "Could not resolve the reusable-workflow commit SHA (job.workflow_sha was empty); refusing to fall back to the default branch." >&2
            exit 1
          fi
          echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinning tool checkout to ${{ job.workflow_repository }}@$WORKFLOW_SHA"

      - name: Checkout vi-history-suite
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.toolref.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Runner Prerequisites
        env:
          CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
        run: |
          # GitHub-hosted ubuntu-latest ships Docker and a running daemon; the
          # NI LabVIEW image is not pre-pulled, so pull it here. Fail fast with
          # an actionable message if docker is unavailable, instead of dying
          # deep in the review step. The comparison runs the
          # nationalinstruments/labview image.
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is required but was not found on PATH." >&2
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "docker is installed but the daemon is not reachable." >&2
            exit 1
          fi
          image="nationalinstruments/labview:${CONTAINER_IMAGE_VERSION}-linux"
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "NI LabVIEW image '$image' already present."
          else
            echo "Pulling NI LabVIEW image '$image' ..."
            docker pull "$image"
          fi
          echo "docker ready and NI LabVIEW image '$image' available."

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Clone Target Repository And Resolve Range
        env:
          GH_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Clone the target repository (never checked out into the trusted
          # workspace tree) and resolve the review range from the PR: head is
          # the PR head commit, base is the merge-base with the PR base branch.
          rm -rf target-clone
          gh repo clone "$TARGET_REPOSITORY" target-clone -- --no-single-branch
          expected_head="$(gh pr view "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          base_ref="$(gh pr view "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY" --json baseRefName --jq '.baseRefName')"
          # Fetch the head via the canonical refs/pull/<n>/head ref, which the
          # BASE repo always serves — including for fork PRs whose head commit
          # is not directly fetchable by bare SHA from origin on some server
          # configs / older git. Resolve the head from that ref rather than
          # trusting the SHA is directly reachable.
          git -C target-clone fetch --no-tags origin "refs/pull/$TARGET_PR_NUMBER/head" "$base_ref"
          head_sha="$(git -C target-clone rev-parse FETCH_HEAD)"
          # Cross-check the fetched tip against the API's headRefOid; if they
          # disagree (e.g. a force-push raced the dispatch), fail closed rather
          # than reviewing an unexpected commit.
          if [ "$head_sha" != "$expected_head" ]; then
            echo "PR head mismatch: refs/pull/$TARGET_PR_NUMBER/head resolved to $head_sha but the API reported $expected_head (force-push race?); refusing to review an unexpected commit." >&2
            exit 1
          fi
          merge_base="$(git -C target-clone merge-base "origin/$base_ref" "$head_sha")"
          echo "Target PR head: $head_sha"
          echo "Target PR base ref: $base_ref"
          echo "Resolved merge base: $merge_base"
          echo "REVIEW_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "REVIEW_MERGE_BASE=$merge_base" >> "$GITHUB_ENV"

      - name: Warm Changed-VI Previews For Correlation
        if: ${{ inputs.correlate_previews && inputs.preview_cache_dir == '' && inputs.auto_warm_changed_previews }}
        env:
          CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
        run: |
          # VHS-REQ-703.6: when correlation is requested without an external
          # cache, render the previews of the VIs changed in this PR into a temp
          # cache so the head-side peek can hit. The preview peek reads the
          # on-disk working tree, so check out the PR head first (the comparison
          # materializes base/head from git objects and is unaffected). Bounded:
          # only the changed VIs are rendered, and a warm failure is non-fatal
          # (the review still runs; correlation just reports fewer hits).
          warm_tmp="$RUNNER_TEMP/vi-semantic-pr-review-staging"
          mkdir -p "$warm_tmp"
          export TMPDIR="$warm_tmp"
          git -C target-clone checkout --detach "$REVIEW_HEAD_SHA"
          # Sort the changed VIs the same way the review selects them (localeCompare
          # order, then the first maxVis are compared). Warming in that same sorted,
          # capped order means the VIs we render are exactly the ones the review
          # will compare/correlate — not a different diff-order slice. Keep this cap
          # in sync with the CLI's DEFAULT_MAX_VIS (50).
          REVIEW_MAX_VIS=50
          mapfile -t changed_vis < <(git -C target-clone diff --name-only --diff-filter=d "$REVIEW_MERGE_BASE" "$REVIEW_HEAD_SHA" | grep -iE '\.(vi|vit|vim|ctl)$' | LC_ALL=C sort | head -n "$REVIEW_MAX_VIS" || true)
          if [ "${#changed_vis[@]}" -eq 0 ]; then
            echo "No changed VIs to warm; correlation will report previews unavailable."
            exit 0
          fi
          cache_dir="$RUNNER_TEMP/vihs-preview-correlation-cache"
          warm_args=(
            --repo-root target-clone
            --cache-dir "$cache_dir"
            --container-image "nationalinstruments/labview:${CONTAINER_IMAGE_VERSION}-linux"
          )
          for vi in "${changed_vis[@]}"; do warm_args+=(--vi "$vi"); done
          node out/cli/runViPreviewCacheWarmer.js "${warm_args[@]}" \
            || echo "::warning::preview warm reported failures; correlation will use whatever was cached."
          echo "AUTO_PREVIEW_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Run VI Semantic PR Review And Post Sticky Comment
        env:
          GH_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
          CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
          CREATE_COMMIT_STATUS: ${{ inputs.create_commit_status }}
          CORRELATE_PREVIEWS: ${{ inputs.correlate_previews }}
          PREVIEW_CACHE_DIR: ${{ inputs.preview_cache_dir }}
        run: |
          # The docker comparison bind-mounts its staging directory into the
          # LabVIEW container. snap-packaged Docker runs in a private mount
          # namespace with its own /tmp, so a staging directory under the
          # default /tmp is invisible inside the container and the compare fails
          # with "VI path invalid or does not exist". Point the CLI's temp root
          # at a directory under the runner workspace ($RUNNER_TEMP lives under
          # the runner home), which snap Docker can bind-mount, so staging is
          # visible in the container on both snap and native Docker hosts.
          review_tmp="$RUNNER_TEMP/vi-semantic-pr-review-staging"
          mkdir -p "$review_tmp"
          export TMPDIR="$review_tmp"
          # Pass the canonical <version>-linux tag: the runtime locator parses a
          # full container tag and silently falls back to the default image for a
          # bare version, which would run the wrong image for a non-default
          # container_image_version even though the prerequisite step validated
          # the requested one.
          # Optionally publish inline diff images (needs a contents:write token)
          # and/or post a gateable commit status (needs a statuses:write token);
          # both off by default so they do not force a token-scope change.
          # Build the CLI argument list as an array so every value (including a
          # preview_cache_dir that contains spaces or starts with a dash) stays
          # a single intact argument when expanded as "${args[@]}".
          args=(
            --repository-root target-clone
            --base "$REVIEW_MERGE_BASE" --head "$REVIEW_HEAD_SHA"
            --runtime-provider docker --container-image-version "${CONTAINER_IMAGE_VERSION}-linux"
            --out review-out
            --announce-start
            --post-comment --pr "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY"
          )
          if [ "$PUBLISH_IMAGES" = "true" ]; then args+=(--publish-images); fi
          if [ "$CREATE_COMMIT_STATUS" = "true" ]; then args+=(--commit-status); fi
          # Optionally attach the deterministic preview⇄comparison correlation
          # (VHS-REQ-703) by peeking the preview cache. The peek is cache-only
          # (launches no runtime) and honest: a miss reports the preview as
          # unavailable rather than fabricating one. The effective cache is the
          # explicit preview_cache_dir input, or the temp cache the auto-warm
          # step produced (AUTO_PREVIEW_CACHE_DIR), if any.
          if [ "$CORRELATE_PREVIEWS" = "true" ]; then
            effective_cache_dir="$PREVIEW_CACHE_DIR"
            if [ -z "$effective_cache_dir" ]; then effective_cache_dir="${AUTO_PREVIEW_CACHE_DIR:-}"; fi
            if [ -z "$effective_cache_dir" ]; then
              echo "::warning::correlate_previews is true but no preview cache is available (preview_cache_dir empty and auto-warm off/empty); skipping preview correlation."
            else
              # The preview peek reads the on-disk working tree (its content-
              # addressed key must match the head render in the cache), but the
              # clone's working tree is the default branch. Check out the PR head
              # (detached) so the head-side peek can match. The comparison itself
              # materializes base/head from git objects, so this checkout does
              # not affect it. (Idempotent when the warm step already did it.)
              git -C target-clone checkout --detach "$REVIEW_HEAD_SHA"
              args+=(--correlate-previews --preview-cache-dir "$effective_cache_dir")
            fi
          fi
          node out/cli/runViSemanticPrReview.js "${args[@]}"

      - name: Upload Review Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vi-semantic-pr-review-${{ github.run_id }}
          path: review-out/**
          if-no-files-found: warn
          retention-days: 14
