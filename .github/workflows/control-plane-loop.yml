name: Control-Plane Loop

# VHS-REQ-698 (Agent Operating Control-Plane, epic #2144): the drift radar (slice
# 1) of the read -> shadow -> apply loop. It reads directly-verifiable ground
# truth (how far the project board is behind verified reality, plus governance
# gate health and open-work state) and upserts a single sticky "Control-Plane
# Drift Radar" tracking issue.
#
# This workflow is READ-ONLY with respect to the project board: it never edits
# Project #4. Its only write is upserting the sticky issue via the ambient
# GITHUB_TOKEN (issues:write). The Tier-1 board apply that would act on the drift
# is the separate, enable-flag-gated governed write path (VHS-REQ-696), wired in a
# later slice and inert until a committed flag flip AND a provisioned
# Projects-scoped secret are both present.
#
# Manual dispatch only (no schedule yet). The board-drift read fails closed on a
# missing GitHub token, so the job uses the workflow's own GITHUB_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift-radar:
    name: Control-Plane Drift Radar
    runs-on: ubuntu-latest
    # Hoist the Projects-scoped secret to a job env so the Tier-1 apply step can
    # gate on it: the `secrets` context is not available in step `if:`
    # conditions, but `env` is. When the secret is unset this is empty and the
    # apply step is skipped.
    env:
      CONTROL_PLANE_PROJECT_TOKEN: ${{ secrets.CONTROL_PLANE_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render drift radar digest
        env:
          # The board-drift read fails closed without a live token.
          GH_TOKEN: ${{ github.token }}
        run: node scripts/renderControlPlaneDigest.js > control-plane-digest.md

      - name: Upsert sticky drift-radar issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER='<!-- vi-history-suite:control-plane-drift-radar -->'
          TITLE='Control-Plane Drift Radar'
          # Find an existing open issue that carries the sticky marker.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "$MARKER in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body-file control-plane-digest.md
            echo "Updated sticky drift-radar issue #$EXISTING"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file control-plane-digest.md
            echo "Created sticky drift-radar issue"
          fi

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: control-plane-digest
          path: control-plane-digest.md
          if-no-files-found: error

      # Tier-1 board APPLY (VHS-REQ-698 slice 2). Fail-closed on two independent
      # controls: it runs only when the maintainer-provisioned Projects-scoped
      # secret is present, and the governed write path itself refuses unless the
      # committed control-plane-write.json flag is enabled. The ambient
      # GITHUB_TOKEN cannot edit Project #4, so without the secret this step is a
      # no-op by construction.
      - name: Apply Tier-1 board updates (verified truth only)
        if: ${{ env.CONTROL_PLANE_PROJECT_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.CONTROL_PLANE_PROJECT_TOKEN }}
        run: node scripts/controlPlaneApply.js
