name: Marketplace Release

# VHS-REQ-609: This is the single manual release lever. It has NO automatic
# trigger: it runs ONLY from a manual `workflow_dispatch` on an exact
# `vX.Y.Z` tag ref (dispatch on the tag preserves GITHUB_REF, so the exact-tag,
# package-version, and origin/main-reachability guards below stay intact), and it
# publishes only after the protected `marketplace-release` environment approval.
# An authorized agent is responsible for dispatching and approving this workflow
# (a maintainer may also do so).
#
# VHS-REQ-678: the workflow publishes to either the STABLE or the PRE-RELEASE
# Marketplace channel, following the VS Code convention that an odd minor version
# is a pre-release and an even minor version is stable. The channel is derived
# from the tag's minor parity; the optional `channel` dispatch input, when set,
# must AGREE with that parity or the run fails closed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Marketplace channel (empty = derive from version minor parity; odd=pre-release, even=stable)'
        required: false
        type: choice
        options:
          - ''
          - stable
          - prerelease
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marketplace-release:
    name: Marketplace Release
    runs-on: ubuntu-24.04
    environment:
      name: marketplace-release

    env:
      EXTENSION_ID: svelderrainruiz.vi-history-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard Exact Version Tag
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Marketplace releases must run from an exact vX.Y.Z tag. Ref was: $GITHUB_REF" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "Exact release tag accepted: $GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify Package Version
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${{ steps.version.outputs.tag_version }}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match tag $tag_version." >&2
            exit 1
          fi
          echo "Package version matches tag: $package_version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Determine Release Channel
        id: channel
        env:
          REQUESTED_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          # VHS-REQ-678: derive the Marketplace channel from the tag's minor
          # version parity (VS Code convention: odd minor = pre-release, even =
          # stable). The optional `channel` dispatch input, when non-empty, must
          # AGREE with the derived channel or the run fails closed, so a stable
          # tag can never be mis-published to the pre-release channel (or vice
          # versa).
          tag_version="${{ steps.version.outputs.tag_version }}"
          minor="$(echo "$tag_version" | cut -d. -f2)"
          if (( minor % 2 == 1 )); then
            derived_channel="prerelease"
            pre_release="true"
          else
            derived_channel="stable"
            pre_release="false"
          fi
          if [[ -n "$REQUESTED_CHANNEL" && "$REQUESTED_CHANNEL" != "$derived_channel" ]]; then
            echo "Dispatched channel $REQUESTED_CHANNEL disagrees with version-parity channel $derived_channel for $tag_version." >&2
            exit 1
          fi
          echo "channel=$derived_channel" >> "$GITHUB_OUTPUT"
          echo "pre_release=$pre_release" >> "$GITHUB_OUTPUT"
          echo "Release channel: $derived_channel (pre_release=$pre_release) for $tag_version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Tag Is On Main
        run: |
          set -euo pipefail
          git fetch origin main --prune
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must point to a commit reachable from origin/main." >&2
            exit 1
          fi
          echo "Release tag is reachable from origin/main." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guard Release Authority
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          # VHS-REQ-670: fail closed if the gated publish-authority posture is
          # DEFINITIVELY incomplete. The release-state read-model degrades to a
          # pass when it cannot verify the protected environment (e.g. the token
          # lacks environments:read), so this never false-blocks a release; it
          # only bites when authority is provably incomplete.
          node scripts/buildReleaseState.js --strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release Baseline / baseline
        run: |
          {
            echo "## Release Baseline"
            echo "- SemVer tag: $GITHUB_REF_NAME"
            echo "- Baseline SHA: $GITHUB_SHA"
            echo "- Release record: protected marketplace-release environment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Verify Release Runtime Attestation
        run: |
          set -euo pipefail
          echo "Enforcing the mandatory release runtime attestation (VHS-REQ-666) from the committed runtime-validation ledger." | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/checkReleaseReadiness.js --strict --require-release-attestation

      - name: Verify Supply-Chain Provenance Freshness
        run: |
          set -euo pipefail
          echo "Enforcing supply-chain provenance freshness (VHS-REQ-668): every shipped artifact bound to a committed digest must be fresh for this build." | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/checkReleaseReadiness.js --strict --require-supply-chain-fresh

      - name: Locate VSIX
        id: locate-vsix
        run: |
          set -euo pipefail
          vsix_path="$(find . -maxdepth 1 -type f -name 'vi-history-suite-*.vsix' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ -z "$vsix_path" ]]; then
            echo "No vi-history-suite-*.vsix file was produced." >&2
            exit 1
          fi
          echo "vsix_path=$vsix_path" >> "$GITHUB_OUTPUT"
          echo "VSIX: $vsix_path" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Marketplace Pre-Publish Check
        id: prepublish-check
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          if node scripts/verifyMarketplaceListing.js "$EXTENSION_ID" "$TAG_VERSION" --attempts 1 --delay-ms 0 --out release-evidence/marketplace-prepublish-show.json --report-out release-evidence/marketplace-prepublish-check.json; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Marketplace listing already contains version $TAG_VERSION; Publish To Marketplace step will be skipped (idempotent rerun)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Marketplace listing does not yet contain version $TAG_VERSION; Publish To Marketplace step will run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish To Marketplace
        if: steps.prepublish-check.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT is required from the protected marketplace-release environment." >&2
            exit 1
          fi
          # VHS-REQ-678: publish to the pre-release channel with --pre-release
          # when the version-parity channel is pre-release; otherwise publish to
          # the stable channel.
          if [[ "${{ steps.channel.outputs.pre_release }}" == "true" ]]; then
            echo "Publishing to the PRE-RELEASE Marketplace channel." | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/runPinnedVsce.js publish --pre-release --packagePath "${{ steps.locate-vsix.outputs.vsix_path }}"
          else
            echo "Publishing to the STABLE Marketplace channel." | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/runPinnedVsce.js publish --packagePath "${{ steps.locate-vsix.outputs.vsix_path }}"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Verify Marketplace Listing
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          node scripts/verifyMarketplaceListing.js "$EXTENSION_ID" "$TAG_VERSION" --out release-evidence/marketplace-show.json --report-out release-evidence/marketplace-listing-verification.json --attempts 20 --delay-ms 30000
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            releaseTag: process.env.GITHUB_REF_NAME,
            releaseSha: process.env.GITHUB_SHA,
            requiredValidation: [
              'Hosted CI required check includes traceability audit (npm run traceability:audit)',
              'Hosted CI required check includes docs link check (npm run docs:links)',
              'Marketplace workflow validation includes npm run check, npm test, npm run package'
            ],
            retainedArtifacts: [
              'release-evidence/marketplace-show.json',
              'release-evidence/marketplace-listing-verification.json',
              'release-evidence/release-evidence-contract.json',
              'coverage/**',
              'vi-history-suite-*.vsix'
            ],
            releaseCloseoutExpectation: 'Run npm run closeout:evidence for release umbrella closeout evidence, including npm run dod:gate.'
          };
          fs.writeFileSync('release-evidence/release-evidence-contract.json', JSON.stringify(payload, null, 2));
          NODE
          {
            echo "## Marketplace Release Evidence"
            echo "- Extension: $EXTENSION_ID"
            echo "- Version: ${{ steps.version.outputs.tag_version }}"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- Required validation named in evidence:"
            echo "  - Hosted CI traceability audit (npm run traceability:audit)"
            echo "  - Hosted CI docs link check (npm run docs:links)"
            echo "  - Release workflow typecheck, tests, package (npm run check; npm test; npm run package)"
            echo "- Marketplace listing evidence:"
            echo "  - release-evidence/marketplace-show.json"
            echo "  - release-evidence/marketplace-listing-verification.json (bounded retry details)"
            echo "- Retained artifacts:"
            echo "  - release-evidence/release-evidence-contract.json"
            echo "  - coverage/**"
            echo "  - vi-history-suite-*.vsix"
            echo "- Closeout expectation: npm run closeout:evidence, including npm run dod:gate"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-release-${{ github.run_id }}
          path: |
            release-evidence/**
            coverage/**
            vi-history-suite-*.vsix
          if-no-files-found: error
          retention-days: 90
