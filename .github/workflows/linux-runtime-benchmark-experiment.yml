name: Linux Runtime Benchmark Experiment

on:
  workflow_dispatch:
    inputs:
      harness_id:
        description: Canonical harness id to benchmark; defaults to HARNESS-VHS-001 for hosted runs
        required: false
        default: HARNESS-VHS-001
      dashboard_commit_window:
        description: Optional explicit dashboard commit window
        required: false
        default: ""
      engine:
        description: Optional runtime engine override
        required: false
        type: choice
        options:
          - ""
          - labview-cli
          - lvcompare
        default: ""
      strict_rsrc_header:
        description: Require strict RSRC header validation
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - experiment/**
    paths:
      - .github/workflows/linux-runtime-benchmark-experiment.yml
      - docker/github-linux-dashboard-benchmark/**
      - package.json
      - src/cli/runGitHubLinuxDashboardBenchmark.ts
      - src/harness/**
      - src/dashboard/**
      - src/reporting/**
      - tests/unit/runGitHubLinuxDashboardBenchmarkCli.test.ts
      - tests/unit/githubLinuxBenchmarkWorkflow.test.ts

permissions:
  contents: read
  packages: write

concurrency:
  group: vihs-linux-runtime-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      NI_LINUX_IMAGE: nationalinstruments/labview:2026q1-linux
    steps:
      - uses: actions/checkout@v5

      - name: Write benchmark plan receipt
        shell: bash
        run: |
          mkdir -p .cache/github-experiments/linux-dashboard-benchmark/plan
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          benchmark_image="ghcr.io/${owner_lc}/vi-history-suite-source-experiments/linux-dashboard-benchmark"
          cat > .cache/github-experiments/linux-dashboard-benchmark/plan/linux-benchmark-plan.json <<JSON
          {
            "schema": "vi-history-suite/github-linux-dashboard-benchmark-plan@v1",
            "runtimeImage": "nationalinstruments/labview:2026q1-linux",
            "publishedBenchmarkImage": "${benchmark_image}",
            "dockerfile": "docker/github-linux-dashboard-benchmark/Dockerfile",
            "benchmarkEntrypoint": "docker/github-linux-dashboard-benchmark/run-benchmark.sh",
            "benchmarkScript": "npm run benchmark:github:linux:canonical",
            "defaultHarnessId": "HARNESS-VHS-001",
            "defaultTargetRelativePath": "Tooling/deployment/VIP_Pre-Install Custom Action.vi",
            "hostOwnedDeepBenchmarkHarnessId": "HARNESS-VHS-002",
            "hostOwnedDeepBenchmarkTargetRelativePath": "resource/plugins/lv_icon.vi",
            "authorityBoundary": {
              "gitlab": "authority",
              "github": "experiment"
            }
          }
          JSON
          {
            echo "## Linux runtime benchmark plan"
            echo
            echo "- runtime image: \`$NI_LINUX_IMAGE\`"
            echo "- published benchmark image: \`$benchmark_image\`"
            echo "- GitHub default harness: \`HARNESS-VHS-001\`"
            echo "- GitHub default target: \`Tooling/deployment/VIP_Pre-Install Custom Action.vi\`"
            echo "- host-owned deep benchmark: \`HARNESS-VHS-002\` / \`resource/plugins/lv_icon.vi\`"
            echo "- authority boundary: GitLab = authority, GitHub = experiment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan receipt
        uses: actions/upload-artifact@v5
        with:
          name: linux-runtime-benchmark-plan
          path: .cache/github-experiments/linux-dashboard-benchmark/plan/linux-benchmark-plan.json
          if-no-files-found: error

  publish_image:
    needs:
      - plan
    runs-on: ubuntu-latest
    outputs:
      benchmark_image_ref: ${{ steps.meta.outputs.image_ref }}
      benchmark_image_digest: ${{ steps.publish.outputs.image_digest }}
      image_resolution: ${{ steps.publish.outputs.image_resolution }}
    env:
      NI_LINUX_IMAGE: nationalinstruments/labview:2026q1-linux
      LOCAL_BENCHMARK_IMAGE: vi-history-suite-github-linux-dashboard-benchmark:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        name: Resolve benchmark image reference
        shell: bash
        run: |
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=ghcr.io/${owner_lc}/vi-history-suite-source-experiments/linux-dashboard-benchmark" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: publish
        name: Resolve or publish benchmark image
        shell: bash
        run: |
          image_ref="${{ steps.meta.outputs.image_ref }}"
          sha_tag="sha-${GITHUB_SHA}"
          if docker pull "$image_ref:$sha_tag"; then
            image_resolution="reused-existing-sha-tag"
          else
            image_resolution="built-and-pushed"
            docker pull "$NI_LINUX_IMAGE"
            docker build \
              --build-arg BASE_IMAGE="$NI_LINUX_IMAGE" \
              -f docker/github-linux-dashboard-benchmark/Dockerfile \
              -t "$LOCAL_BENCHMARK_IMAGE" \
              .
            docker tag "$LOCAL_BENCHMARK_IMAGE" "$image_ref:$sha_tag"
            docker push "$image_ref:$sha_tag"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              docker tag "$LOCAL_BENCHMARK_IMAGE" "$image_ref:main"
              docker push "$image_ref:main"
            fi
          fi
          repo_digest="$(docker image inspect "$image_ref:$sha_tag" --format '{{index .RepoDigests 0}}')"
          image_digest="${repo_digest#*@}"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "image_resolution=$image_resolution" >> "$GITHUB_OUTPUT"
          mkdir -p .cache/github-experiments/linux-dashboard-benchmark/image
          BENCHMARK_IMAGE_REF="$image_ref" BENCHMARK_IMAGE_DIGEST="$image_digest" IMAGE_RESOLUTION="$image_resolution" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          published_tags = [f"sha-{os.environ['GITHUB_SHA']}"]
          if os.environ.get("GITHUB_REF_NAME") == "main":
              published_tags.append("main")

          payload = {
              "schema": "vi-history-suite/github-linux-dashboard-benchmark-image@v1",
              "runtimeImage": os.environ["NI_LINUX_IMAGE"],
              "benchmarkImageRef": os.environ["BENCHMARK_IMAGE_REF"],
              "benchmarkImageDigest": os.environ["BENCHMARK_IMAGE_DIGEST"],
              "github": {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "sha": os.environ.get("GITHUB_SHA"),
              "refName": os.environ.get("GITHUB_REF_NAME"),
              "publishedTags": published_tags
              },
              "imageResolution": os.environ["IMAGE_RESOLUTION"]
          }
          root = Path(".cache/github-experiments/linux-dashboard-benchmark/image")
          root.mkdir(parents=True, exist_ok=True)
          (root / "latest-image.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload image receipt
        uses: actions/upload-artifact@v5
        with:
          name: linux-runtime-benchmark-image
          path: .cache/github-experiments/linux-dashboard-benchmark/image/latest-image.json
          if-no-files-found: error

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - plan
      - publish_image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NI_LINUX_IMAGE: nationalinstruments/labview:2026q1-linux
      BENCHMARK_IMAGE: ${{ needs.publish_image.outputs.benchmark_image_ref }}@${{ needs.publish_image.outputs.benchmark_image_digest }}
      VIHS_GITHUB_BENCHMARK_HARNESS_ID: ${{ inputs.harness_id }}
      VIHS_GITHUB_BENCHMARK_DASHBOARD_COMMIT_WINDOW: ${{ inputs.dashboard_commit_window }}
      VIHS_GITHUB_BENCHMARK_ENGINE: ${{ inputs.engine }}
      VIHS_GITHUB_BENCHMARK_STRICT_RSRC_HEADER: ${{ inputs.strict_rsrc_header }}
      VIHS_GITHUB_BENCHMARK_RUNTIME_IMAGE: nationalinstruments/labview:2026q1-linux
      VIHS_GITHUB_BENCHMARK_IMAGE_REF: ${{ needs.publish_image.outputs.benchmark_image_ref }}
      VIHS_GITHUB_BENCHMARK_IMAGE_DIGEST: ${{ needs.publish_image.outputs.benchmark_image_digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull published benchmark image
        shell: bash
        run: docker pull "$BENCHMARK_IMAGE"

      - name: Run canonical GitHub benchmark inside derived image
        shell: bash
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_SHA \
            -e GITHUB_REF_NAME \
            -e VIHS_GITHUB_BENCHMARK_HARNESS_ID \
            -e VIHS_GITHUB_BENCHMARK_DASHBOARD_COMMIT_WINDOW \
            -e VIHS_GITHUB_BENCHMARK_ENGINE \
            -e VIHS_GITHUB_BENCHMARK_STRICT_RSRC_HEADER \
            -e VIHS_GITHUB_BENCHMARK_RUNTIME_IMAGE \
            -e VIHS_GITHUB_BENCHMARK_IMAGE_REF \
            -e VIHS_GITHUB_BENCHMARK_IMAGE_DIGEST \
            -v "$PWD":/workspace \
            -w /workspace \
            "$BENCHMARK_IMAGE" \
            bash /workspace/docker/github-linux-dashboard-benchmark/run-benchmark.sh

      - name: Upload benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-runtime-benchmark-${{ inputs.harness_id || 'HARNESS-VHS-001' }}
          path: |
            .cache/github-experiments/linux-dashboard-benchmark/**
            .cache/harness-reports/${{ inputs.harness_id || 'HARNESS-VHS-001' }}/**
          if-no-files-found: warn
