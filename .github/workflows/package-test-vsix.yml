name: Package Test VSIX

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Create a unique immutable diagnostic prerelease for public reporter download.
        required: false
        default: false
        type: boolean
      issue_number:
        description: Optional issue number for diagnostic notes, such as 61.
        required: false
        type: string

permissions:
  contents: write

env:
  TEST_VSIX_RELEASE_TITLE: Diagnostic Test VSIX

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-test-vsix:
    name: Package Test VSIX
    runs-on: ubuntu-24.04

    steps:
      - name: Guard Trusted Ref
        run: |
          set -euo pipefail
          if [[ -n "${VSCE_PAT:-}" || -n "${AZURE_DEVOPS_EXT_PAT:-}" || -n "${OVSX_PAT:-}" ]]; then
            echo "Marketplace publishing tokens must not be present for diagnostic test VSIX packaging." >&2
            exit 1
          fi
          is_main=false
          is_release_branch=false
          is_exact_version_tag=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            is_main=true
          fi
          if [[ "$GITHUB_REF" =~ ^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_release_branch=true
          fi
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_exact_version_tag=true
          fi
          if [[ "$is_main" == "true" || "$is_release_branch" == "true" || "$is_exact_version_tag" == "true" ]]; then
            decision=allowed
          else
            decision=blocked
          fi
          echo "Trusted ref decision: $decision (main=$is_main, releaseBranch=$is_release_branch, exactVersionTag=$is_exact_version_tag, ref=$GITHUB_REF)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$decision" != "allowed" ]]; then
            echo "Diagnostic test VSIX packaging only accepts main, release/v* branches, or exact v* release tags." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Locate VSIX
        id: locate-vsix
        run: |
          set -euo pipefail
          vsix_path="$(find . -maxdepth 1 -type f -name 'vi-history-suite-*.vsix' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ -z "$vsix_path" ]]; then
            echo "No vi-history-suite-*.vsix file was produced." >&2
            exit 1
          fi
          echo "vsix_path=$vsix_path" >> "$GITHUB_OUTPUT"
          {
            echo "## Diagnostic Test VSIX"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- VSIX: $vsix_path"
            echo "- Issue: ${ISSUE_NUMBER:-not specified}"
            echo "- Prerelease requested: $PUBLISH_PRERELEASE"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-test-vsix-${{ github.run_id }}
          path: ${{ steps.locate-vsix.outputs.vsix_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Compute Diagnostic Prerelease Tag
        id: diagnostic-release
        if: ${{ inputs.publish_prerelease }}
        run: |
          set -euo pipefail
          diagnostic_release_tag="diagnostic-test-vsix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$diagnostic_release_tag" >> "$GITHUB_OUTPUT"
          echo "Diagnostic prerelease tag: $diagnostic_release_tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare Prerelease Notes
        if: ${{ inputs.publish_prerelease }}
        run: |
          set -euo pipefail
          issue_line="Issue: not specified"
          if [[ -n "${ISSUE_NUMBER:-}" ]]; then
            issue_line="Issue: #$ISSUE_NUMBER"
          fi
          cat > diagnostic-test-vsix-notes.md <<EOF
          Diagnostic test VSIX for reporter retesting.

          - $issue_line
          - Source ref: $GITHUB_REF
          - Source SHA: $GITHUB_SHA
          - Diagnostic release tag: $DIAGNOSTIC_RELEASE_TAG
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is not a Marketplace publication. Install with:

          \`\`\`powershell
          code --install-extension .\\vi-history-suite-*.vsix --force
          \`\`\`
          EOF
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DIAGNOSTIC_RELEASE_TAG: ${{ steps.diagnostic-release.outputs.tag }}

      - name: Create Diagnostic Prerelease Tag
        if: ${{ inputs.publish_prerelease }}
        run: |
          set -euo pipefail
          diagnostic_release_tag="${{ steps.diagnostic-release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$diagnostic_release_tag" >/dev/null 2>&1; then
            echo "Diagnostic prerelease tag already exists: $diagnostic_release_tag" >&2
            exit 1
          fi
          git tag "$diagnostic_release_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$diagnostic_release_tag"

      - name: Create Immutable Diagnostic Prerelease
        if: ${{ inputs.publish_prerelease }}
        run: |
          set -euo pipefail
          diagnostic_release_tag="${{ steps.diagnostic-release.outputs.tag }}"
          gh release create "$diagnostic_release_tag" \
            "${{ steps.locate-vsix.outputs.vsix_path }}#VI History Suite diagnostic VSIX" \
            --verify-tag \
            --title "$TEST_VSIX_RELEASE_TITLE" \
            --notes-file diagnostic-test-vsix-notes.md \
            --prerelease \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
