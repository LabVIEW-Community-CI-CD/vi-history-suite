name: Vagrant VSIX Acceptance

# Builds the vi-history-suite vsix, ships it to a Windows 11 + LabVIEW 2026
# Vagrant VM, installs it, and runs the governed report-smoke proof.
#
# Runner requirements:
#   The `vagrant-acceptance` job must run on a self-hosted Linux runner that has:
#     - VirtualBox installed
#     - Vagrant >= 2.3 installed
#     - The registered Vagrant box named by the VIHS_VAGRANT_BOX variable
#
# GitHub Actions variables (repository or environment level):
#   VIHS_VAGRANT_BOX  – Vagrant box name (e.g. "vihs/win11-labview2026")
#   VIHS_VIRTUALBOX_VM_NAME – Existing VirtualBox VM name (e.g. "windows11")
#
# No secrets required: LabVIEW and VS Code are already inside the VM box.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
    paths:
      - '.github/workflows/vagrant-vsix-acceptance.yml'
      - 'vagrant/**'
      - 'src/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/vagrant-vsix-acceptance.yml'
      - 'vagrant/**'
      - 'src/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  # One acceptance run at a time per ref to avoid racing over the single VM
  group: vagrant-vsix-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the vsix and compile TypeScript on a GitHub-hosted runner
  # ---------------------------------------------------------------------------
  build:
    name: Build vsix
    runs-on: ubuntu-24.04
    outputs:
      vsix_name: ${{ steps.vsix_name.outputs.vsix_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Audit packaged runtime surface
        run: npm run package:audit

      - name: Build vsix
        # docs:bundle requires a sibling wiki repo that is not available in CI.
        # The committed resources/bundled-docs/ content is used as-is, which is
        # correct for release builds where the wiki was synced before tagging.
        run: node scripts/runPinnedVsce.js package

      - name: Resolve vsix filename
        id: vsix_name
        run: |
          name=$(ls *.vsix | head -1)
          echo "vsix_name=${name}" >> "$GITHUB_OUTPUT"
          echo "Built: ${name}"

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.vsix_name.outputs.vsix_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Archive compiled output
        run: tar -czf out.tar.gz out/

      - name: Upload compiled output artefact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-out
          path: out.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Run the governed proof inside the Vagrant Windows 11 VM
  # ---------------------------------------------------------------------------
  vagrant-acceptance:
    name: Vagrant acceptance (Windows 11 + LabVIEW 2026)
    runs-on: [self-hosted, linux, virtualbox]
    needs: build
    timeout-minutes: 60

    env:
      VIHS_VAGRANT_BOX: ${{ vars.VIHS_VAGRANT_BOX || 'vihs/win11-labview2026' }}
      VIHS_VIRTUALBOX_VM_NAME: ${{ vars.VIHS_VIRTUALBOX_VM_NAME || 'windows11' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download vsix artefact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vagrant/shared

      - name: Download compiled output artefact
        uses: actions/download-artifact@v4
        with:
          name: compiled-out
          path: .

      - name: Expand compiled output
        run: |
          tar -xzf out.tar.gz
          echo "Compiled outputs restored:"
          ls out/cli/ | head -10

      - name: Prepare evidence directory
        run: mkdir -p vagrant/evidence

      - name: Verify Vagrant + VirtualBox prerequisites
        run: |
          set -euo pipefail
          echo "Vagrant: $(vagrant --version)"
          echo "VBoxManage: $(VBoxManage --version)"
          echo "Existing VM: ${VIHS_VIRTUALBOX_VM_NAME}"
          echo "Box configured: ${VIHS_VAGRANT_BOX}"

      - name: Prepare Vagrant box from existing VM
        run: ./.github/scripts/vagrant/prepare-existing-vm-box.sh
        env:
          VIHS_VIRTUALBOX_VM_NAME: ${{ env.VIHS_VIRTUALBOX_VM_NAME }}
          VIHS_VAGRANT_BOX: ${{ env.VIHS_VAGRANT_BOX }}
          VIHS_VAGRANT_BOX_FILE: .cache/vagrant/windows11.box

      - name: Boot VM
        working-directory: vagrant
        run: vagrant up --no-provision
        env:
          VIHS_VAGRANT_BOX: ${{ env.VIHS_VAGRANT_BOX }}

      - name: Run bootstrap provisioner (skipped if already done)
        working-directory: vagrant
        run: vagrant provision --provision-with bootstrap
        env:
          VIHS_VAGRANT_BOX: ${{ env.VIHS_VAGRANT_BOX }}

      - name: Force cold LabVIEW state before acceptance
        run: |
          set -euo pipefail
          log="vagrant/evidence/labview-cold-prep.log"
          : > "$log"

          echo "Stopping LabVIEW inside guest (if running)..." | tee -a "$log"
          VBoxManage guestcontrol "${VIHS_VIRTUALBOX_VM_NAME}" run \
            --username vagrant --password "Vagrant1234!" \
            -- cmd.exe /c "powershell -ExecutionPolicy Bypass -Command \"Stop-Process -Name LabVIEW -Force -ErrorAction SilentlyContinue; Write-Host 'LabVIEW stop attempted'\"" \
            2>&1 | tee -a "$log"

          echo "Waiting for 3363 LISTENING sockets to clear..." | tee -a "$log"
          for i in $(seq 1 18); do
            result=$(VBoxManage guestcontrol "${VIHS_VIRTUALBOX_VM_NAME}" run \
              --username vagrant --password "Vagrant1234!" \
              -- cmd.exe /c "powershell -ExecutionPolicy Bypass -Command \"netstat -an | Select-String ':3363.*LISTENING'\"" \
              2>&1 || true)
            echo "[$i/18] ${result}" | tee -a "$log"
            if [[ -z "${result//[[:space:]]/}" ]]; then
              echo "Port 3363 is no longer LISTENING." | tee -a "$log"
              break
            fi
            sleep 5
            if [[ "$i" -eq 18 ]]; then
              echo "ERROR: Port 3363 remained LISTENING after cold-prep wait window." | tee -a "$log"
              exit 1
            fi
          done

      - name: Run acceptance provisioner
        working-directory: vagrant
        run: |
          set -euo pipefail
          vagrant provision --provision-with acceptance 2>&1 | tee evidence/acceptance-provision.log
        env:
          VIHS_VAGRANT_BOX: ${{ env.VIHS_VAGRANT_BOX }}

      - name: Assert cold-start launch markers
        if: always()
        run: |
          set -euo pipefail
          log="vagrant/evidence/acceptance-provision.log"
          if [[ ! -f "$log" ]]; then
            echo "ERROR: Missing acceptance log at $log"
            exit 1
          fi

          grep -F "LabVIEW not running. Launching via scheduled task..." "$log" >/dev/null || {
            echo "ERROR: Cold-start marker missing. Acceptance may not have exercised the cold launch path."
            exit 1
          }

          grep -F "LabVIEW VI Server ready on port 3363." "$log" >/dev/null || {
            echo "ERROR: VI Server readiness marker missing after scheduled task launch."
            exit 1
          }

          echo "Cold-start assertions passed."

      - name: Halt VM
        if: always()
        working-directory: vagrant
        run: vagrant halt --force
        env:
          VIHS_VAGRANT_BOX: ${{ env.VIHS_VAGRANT_BOX }}

      - name: Print manifest
        if: always()
        run: |
          latest=$(ls -dt vagrant/evidence/*/ 2>/dev/null | head -1)
          if [[ -n "${latest}" && -f "${latest}/manifest.json" ]]; then
            echo "=== Acceptance Manifest ==="
            cat "${latest}/manifest.json"
          else
            echo "No manifest found in vagrant/evidence/"
          fi

      - name: Upload evidence artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vagrant-acceptance-evidence
          path: vagrant/evidence/**
          if-no-files-found: warn
          retention-days: 30
