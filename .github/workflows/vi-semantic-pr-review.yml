name: VI Semantic PR Review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository (owner/repo) whose pull request should be reviewed.'
        required: true
      pr_number:
        description: 'Pull request number in the target repository to review.'
        required: true
      container_image_version:
        description: 'NI LabVIEW container image version (e.g. 2026q1). The -linux tag is derived.'
        required: false
        default: '2026q1'
      publish_images:
        description: 'Embed inline diff images in the review comment (needs a contents:write token on the target repo).'
        required: false
        default: false
        type: boolean
      create_commit_status:
        description: 'Post a gateable VI Semantic Review commit status on the PR head (needs a statuses:write token on the target repo).'
        required: false
        default: false
        type: boolean
      correlate_previews:
        description: 'Attach the deterministic preview⇄comparison correlation (VHS-REQ-703) by peeking a preview cache. Uses preview_cache_dir when non-empty; otherwise, if auto_warm_changed_previews is on, the changed VIs are warmed into a temp cache first. With neither, correlation warns and skips (non-fatal). Off by default.'
        required: false
        default: false
        type: boolean
      preview_cache_dir:
        description: 'Filesystem path readable by the review job (e.g. under the runner workspace or $RUNNER_TEMP) to a content-addressed preview cache to peek for correlation (VHS-REQ-703.4). Used only when correlate_previews is true and this path is non-empty; empty falls back to auto-warm (if enabled) or skips.'
        required: false
        default: ''
      auto_warm_changed_previews:
        description: 'When correlate_previews is true and preview_cache_dir is empty, render the changed VIs'' previews into a temp cache first so correlation gets a head-side hit (VHS-REQ-703.6). Adds a bounded LabVIEW render per changed VI. Off by default.'
        required: false
        default: false
        type: boolean
      base_tree_dir:
        description: 'Already-materialized base-revision tree root whose previews are present in preview_cache_dir, enabling base-side correlation on the external-cache path (VHS-REQ-703.7). The auto-warm path materializes its own base tree and does not need this.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # Maintainer dispatch entry point. The review logic lives in the reusable
  # vi-semantic-pr-review-callable.yml (VHS-REQ-661) so this dispatch and any
  # external LabVIEW repo share one source of truth; enforce_trusted_ref keeps
  # the privileged cross-repo token gated to trusted vi-history-suite refs here.
  review:
    uses: ./.github/workflows/vi-semantic-pr-review-callable.yml
    with:
      repository: ${{ inputs.repository }}
      pr_number: ${{ inputs.pr_number }}
      container_image_version: ${{ inputs.container_image_version }}
      enforce_trusted_ref: true
      publish_images: ${{ inputs.publish_images }}
      create_commit_status: ${{ inputs.create_commit_status }}
      correlate_previews: ${{ inputs.correlate_previews }}
      preview_cache_dir: ${{ inputs.preview_cache_dir }}
      auto_warm_changed_previews: ${{ inputs.auto_warm_changed_previews }}
      base_tree_dir: ${{ inputs.base_tree_dir }}
    secrets:
      VI_REVIEW_TARGET_TOKEN: ${{ secrets.VI_REVIEW_TARGET_TOKEN }}
