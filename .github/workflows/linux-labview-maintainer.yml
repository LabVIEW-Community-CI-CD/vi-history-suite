name: Linux LabVIEW Maintainer Validation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-labview-maintainer:
    name: Linux LabVIEW Maintainer Validation
    runs-on: [self-hosted, Linux, X64, vihs-linux-labview-maintainer]
    timeout-minutes: 90

    steps:
      - name: Guard Trusted Ref
        run: |
          mkdir -p runner-evidence
          summary_path="runner-evidence/linux-labview-maintainer-summary.txt"
          is_main=false
          is_release_branch=false
          is_exact_version_tag=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then is_main=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_release_branch=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_exact_version_tag=true; fi
          is_trusted_ref=false
          if [ "$is_main" = true ] || [ "$is_release_branch" = true ] || [ "$is_exact_version_tag" = true ]; then
            is_trusted_ref=true
          fi
          decision="blocked"
          if [ "$is_trusted_ref" = true ]; then decision="allowed"; fi
          guard_line="Trusted ref decision: $decision (main=$is_main, releaseBranch=$is_release_branch, exactVersionTag=$is_exact_version_tag, ref=$GITHUB_REF)"
          echo "$guard_line" | tee "$summary_path"
          if [ "$is_trusted_ref" != true ]; then
            echo "This maintainer runner only accepts main, release/v* branches, or exact v* release tags. Ref was: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Capture Environment Summary
        run: |
          if [ -n "$VSCE_PAT" ] || [ -n "$AZURE_DEVOPS_EXT_PAT" ] || [ -n "$OVSX_PAT" ]; then
            echo "Marketplace publishing tokens must not be present on this maintainer validation runner." >&2
            exit 1
          fi

          # actions/checkout cleans the workspace, removing the runner-evidence
          # directory created by the pre-checkout Guard step; recreate it before
          # writing the environment summary.
          mkdir -p runner-evidence
          summary_path="runner-evidence/linux-labview-maintainer-summary.txt"
          candidate_paths=(
            "/usr/bin/code"
            "/usr/share/code/bin/code"
            "/snap/bin/code"
            "/usr/local/natinst/LabVIEW-2026-64/labview"
            "/usr/local/natinst/LabVIEW-2026Q1-64/labview"
            "/usr/local/natinst/LabVIEW-2026Q3-64/labview"
            "/usr/local/bin/labviewcli"
            "/usr/local/natinst/shared/nilvcli/nilvcli"
          )

          is_main=false
          is_release_branch=false
          is_exact_version_tag=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then is_main=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_release_branch=true; fi
          if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then is_exact_version_tag=true; fi
          is_trusted_ref=false
          if [ "$is_main" = true ] || [ "$is_release_branch" = true ] || [ "$is_exact_version_tag" = true ]; then
            is_trusted_ref=true
          fi

          labview_cli=""
          for candidate_cli in labviewcli LabVIEWCLI nilvcli; do
            if command -v "$candidate_cli" >/dev/null 2>&1; then
              labview_cli="$(command -v "$candidate_cli")"
              break
            fi
          done

          {
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "SHA: $GITHUB_SHA"
            echo "Runner: $RUNNER_NAME"
            echo "Runner labels: $RUNNER_LABELS"
            echo "Runner OS: $RUNNER_OS"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Git: $(git --version)"
            echo "Evidence summary path: runner-evidence/linux-labview-maintainer-summary.txt"
            echo "Trusted ref decision: $is_trusted_ref (main=$is_main, releaseBranch=$is_release_branch, exactVersionTag=$is_exact_version_tag)"
            echo "VSIX evidence path: pending package step"
          } > "$summary_path"

          for candidate_path in "${candidate_paths[@]}"; do
            if [ -e "$candidate_path" ]; then state="present"; else state="missing"; fi
            printf '%s\t%s\n' "$state" "$candidate_path" >> "$summary_path"
          done

          if [ -n "$labview_cli" ]; then
            echo "LabVIEW CLI detected: true" >> "$summary_path"
            echo "LabVIEW CLI command: $labview_cli" >> "$summary_path"
          else
            echo "LabVIEW CLI detected: false" >> "$summary_path"
            echo "LabVIEW CLI command: missing from PATH" >> "$summary_path"
          fi

          cat "$summary_path"

      - name: Validate Runner Prerequisites
        run: |
          # Fail fast with a consolidated, actionable report of every missing
          # host prerequisite (VS Code, LabVIEW, LabVIEW CLI, Node, npm, Git)
          # before the heavyweight validation, instead of dying one step at a
          # time deep in the run. Self-service equivalent for maintainers:
          # `node scripts/checkMaintainerRunnerPrerequisites.js` on the runner.
          node scripts/checkMaintainerRunnerPrerequisites.js

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Record VSIX Evidence Path
        if: always()
        run: |
          mkdir -p runner-evidence
          summary_path="runner-evidence/linux-labview-maintainer-summary.txt"
          vsix="$(ls -1t vi-history-suite-*.vsix 2>/dev/null | head -n 1 || true)"
          if [ -n "$vsix" ]; then
            echo "VSIX evidence path: $(pwd)/$vsix" | tee -a "$summary_path"
          else
            echo "VSIX evidence path: missing" | tee -a "$summary_path"
          fi

      - name: Linux Integration Host
        run: npm run test:integration:linux

      - name: Upload Maintainer Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-labview-maintainer-${{ github.run_id }}
          path: |
            vi-history-suite-*.vsix
            runner-evidence/**
          if-no-files-found: warn
          retention-days: 14
