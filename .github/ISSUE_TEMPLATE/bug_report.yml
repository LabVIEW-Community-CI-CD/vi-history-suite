name: Bug Report
description: Report a problem with VI History Suite.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough context for a maintainer to reproduce or route it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected Surface
      description: Pick the closest surface so maintainers can route the report.
      options:
        - VI history eligibility or Git history display
        - History panel or Git history display
        - Compare/runtime validation
        - Runtime settings CLI
        - Marketplace, install, or documentation
        - Other or unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the smallest steps that show the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include VS Code, OS, LabVIEW, provider, and extension version when relevant.
      placeholder: |
        - OS:
        - VS Code:
        - VI History Suite:
        - LabVIEW:
        - Runtime provider:
    validations:
      required: false
  - type: textarea
    id: eligibility_evidence
    attributes:
      label: Eligibility / Git History Evidence
      description: For eligibility or Git history reports, include selected-file facts, tracking/history observations, and the ineligibility message when shown. Leave blank for runtime-only reports. Do not include secrets.
      render: text
      placeholder: |
        - Selected file path or extension:
        - Is the file tracked in Git, if known:
        - Commit count or history facts shown, if known:
        - Ineligibility message or Git/history error:
    validations:
      required: false
  - type: textarea
    id: runtime_validation_output
    attributes:
      label: Runtime Validation Output
      description: Paste concise `vihs --validate` or comparison-runtime output separately from eligibility evidence. Leave blank for eligibility-only reports. Do not include secrets.
      render: text
      placeholder: Paste runtime validation output here when relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Screenshots
      description: Paste other concise logs or attach screenshots when useful. Do not include secrets.
      render: text
    validations:
      required: false
