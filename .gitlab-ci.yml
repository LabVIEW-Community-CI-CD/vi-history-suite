stages:
  - docs
  - test
  - image
  - package
  - release

docs_link_check:
  stage: docs
  image:
    name: lycheeverse/lychee:latest
    entrypoint:
      - ""
  script:
    - lychee --verbose --no-progress --include-fragments README.md docs/**/*.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

docs_continuous_integration:
  stage: docs
  image: node:24
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - export VIHS_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.wiki"
    - npm ci
    - node scripts/run-docs-continuous-integration.js --skip-links --evidence-dir docs-integration-evidence
  artifacts:
    when: always
    expire_in: never
    paths:
      - docs-integration-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

publish_docs_authoring_image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint:
      - ""
  script:
    - mkdir -p /kaniko/.docker docs-workbench-evidence
    - |
      cat > /kaniko/.docker/config.json <<JSON
      {
        "auths": {
          "${CI_REGISTRY}": {
            "username": "${CI_REGISTRY_USER}",
            "password": "${CI_REGISTRY_PASSWORD}"
          }
        }
      }
      JSON
    - |
      DESTINATIONS="--destination=${CI_REGISTRY_IMAGE}/docs-authoring:sha-${CI_COMMIT_SHORT_SHA}"
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        DESTINATIONS="${DESTINATIONS} --destination=${CI_REGISTRY_IMAGE}/docs-authoring:main"
      fi
      if echo "${CI_COMMIT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        DESTINATIONS="${DESTINATIONS} --destination=${CI_REGISTRY_IMAGE}/docs-authoring:${CI_COMMIT_TAG}"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/docs-authoring/Dockerfile" \
        ${DESTINATIONS}
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const path = require('node:path');
      const pkg = require('./package.json');

      const pushedTags = [`sha-${process.env.CI_COMMIT_SHORT_SHA || ''}`].filter(Boolean);
      if ((process.env.CI_COMMIT_BRANCH || '') === (process.env.CI_DEFAULT_BRANCH || '')) {
        pushedTags.push('main');
      }
      if (/^v\d+\.\d+\.\d+$/.test(process.env.CI_COMMIT_TAG || '')) {
        pushedTags.push(process.env.CI_COMMIT_TAG);
      }

      const manifest = {
        shipId: 'SHIP-0001',
        activeIssueId: 'ISSUE-0406',
        packageVersion: pkg.version,
        commitSha: process.env.CI_COMMIT_SHA || '',
        ref: process.env.CI_COMMIT_REF_NAME || '',
        imageName: `${process.env.CI_REGISTRY_IMAGE}/docs-authoring`,
        pushedTags,
        defaultCommand: 'npm run docs:gate',
        dockerfile: 'docker/docs-authoring/Dockerfile',
        workbenchDoc: 'docs/documentation-workbench.md'
      };

      fs.writeFileSync(
        path.join('docs-workbench-evidence', 'docs-workbench-manifest.json'),
        `${JSON.stringify(manifest, null, 2)}\n`
      );
      NODE
  artifacts:
    when: always
    expire_in: never
    paths:
      - docs-workbench-evidence/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

wiki_workbench_prepare_published:
  stage: package
  image: ${CI_REGISTRY_IMAGE}/docs-authoring:sha-${CI_COMMIT_SHORT_SHA}
  needs:
    - publish_docs_authoring_image
  script:
    - mkdir -p wiki-workbench-evidence
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - npm run compile
    - node out/cli/runWikiWorkbench.js doctor --format json > wiki-workbench-evidence/doctor.json
    - node out/cli/runWikiWorkbench.js plan-pages --format json > wiki-workbench-evidence/plan.json
    - node out/cli/runWikiWorkbench.js prepare-publication --format json > wiki-workbench-evidence/prepare.json
    - cp .cache/wiki-workbench/latest-workbench.json wiki-workbench-evidence/wiki-workbench-manifest.json
    - mkdir -p wiki-workbench-evidence/staging wiki-workbench-evidence/publication-prep
    - if [ -d .cache/wiki-workbench/staging ]; then cp -R .cache/wiki-workbench/staging/. wiki-workbench-evidence/staging/; fi
    - if [ -d .cache/wiki-workbench/publication-prep ]; then cp -R .cache/wiki-workbench/publication-prep/. wiki-workbench-evidence/publication-prep/; fi
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const path = require('node:path');

      const doctor = JSON.parse(fs.readFileSync(path.join('wiki-workbench-evidence', 'doctor.json'), 'utf8'));
      const plan = JSON.parse(fs.readFileSync(path.join('wiki-workbench-evidence', 'plan.json'), 'utf8'));
      const prepare = JSON.parse(fs.readFileSync(path.join('wiki-workbench-evidence', 'prepare.json'), 'utf8'));
      const workbench = JSON.parse(fs.readFileSync(path.join('wiki-workbench-evidence', 'wiki-workbench-manifest.json'), 'utf8'));

      const report = [
        '# Wiki Workbench Iteration Report',
        '',
        `- Image: ${process.env.CI_REGISTRY_IMAGE}/docs-authoring:sha-${process.env.CI_COMMIT_SHORT_SHA || ''}`,
        `- Authority repo: ${workbench.authorityRepo?.localPath || ''}`,
        `- Wiki repo: ${workbench.wikiRepo?.localPath || ''}`,
        `- Planned pages: ${(plan.pages || []).length}`,
        `- Prepared page: ${prepare.page?.id || ''}`,
        `- Publication mode: ${prepare.publicationMode || ''}`,
        `- Completion state: ${prepare.completionState || ''}`,
        `- Ledger update required: ${String(prepare.ledgerUpdateRequired)}`,
        `- Doctor issues: ${(doctor.issues || []).length}`,
        `- Prepare note: ${prepare.message || ''}`
      ].join('\n');

      fs.writeFileSync(
        path.join('wiki-workbench-evidence', 'iteration-report.md'),
        `${report}\n`
      );
      NODE
  artifacts:
    when: always
    expire_in: never
    paths:
      - wiki-workbench-evidence/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test_extension:
  stage: test
  image: node:24
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - export VIHS_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.wiki"
    - npm ci
    - npm run compile
    - npm run test
    - echo "PR Coverage Gate / coverage"
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const summary = JSON.parse(
        fs.readFileSync('coverage/coverage-summary.json', 'utf8')
      );
      const pct = Number(summary.total.lines.pct || 0);
      console.log(`coverage summary ${pct.toFixed(1)}%`);
      if (pct < 80) {
        process.exit(1);
      }
      NODE
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

package_extension_preview:
  stage: package
  image: node:24
  needs:
    - test_extension
  script:
    - npm ci
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - mkdir -p preview-evidence
    - npm run compile
    - npm run package -- --out "preview-evidence/vi-history-suite-${PACKAGE_VERSION}.vsix"
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const path = require('node:path');
      const pkg = require('./package.json');
      const manifest = {
        shipId: 'SHIP-0001',
        ref: process.env.CI_COMMIT_REF_NAME || '',
        commitSha: process.env.CI_COMMIT_SHA || '',
        packageVersion: pkg.version,
        previewVsix: {
          fileName: `vi-history-suite-${pkg.version}.vsix`,
          path: `preview-evidence/vi-history-suite-${pkg.version}.vsix`
        }
      };
      fs.writeFileSync(
        path.join('preview-evidence', 'preview-manifest.json'),
        `${JSON.stringify(manifest, null, 2)}\n`
      );
      NODE
  artifacts:
    when: always
    paths:
      - preview-evidence/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release_extension:
  stage: release
  image: node:24
  needs:
    - test_extension
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - export VIHS_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.wiki"
    - npm ci
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "v${PACKAGE_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package version ${PACKAGE_VERSION}" >&2
        exit 1
      fi
    - npm run compile
    - npm run test
    - mkdir -p release-evidence
    - cp -R coverage release-evidence/coverage
    - cp coverage/cobertura-coverage.xml release-evidence/coverage.xml
    - npm run package -- --out "release-evidence/vi-history-suite-${PACKAGE_VERSION}.vsix"
    - |
      node - <<'NODE'
      const crypto = require('node:crypto');
      const fs = require('node:fs');
      const path = require('node:path');

      const pkg = require('./package.json');
      const tag = process.env.CI_COMMIT_TAG || '';
      const commitSha = process.env.CI_COMMIT_SHA || '';
      const version = pkg.version;
      const vsixFileName = `vi-history-suite-${version}.vsix`;
      const vsixPath = path.join('release-evidence', vsixFileName);
      const manifestPath = path.join('release-evidence', 'release-manifest.json');
      const checksum = crypto
        .createHash('sha256')
        .update(fs.readFileSync(vsixPath))
        .digest('hex');

      const manifest = {
        shipId: 'SHIP-0001',
        tag,
        packageVersion: version,
        commitSha,
        vsixArtifact: {
          fileName: vsixFileName,
          path: vsixPath,
          sha256: checksum
        },
        retainedEvidence: [
          'release-evidence/coverage/',
          'release-evidence/coverage.xml',
          'release-evidence/release-record.md',
          'release-evidence/release-manifest.json'
        ]
      };

      fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
      fs.writeFileSync(
        path.join('release-evidence', `${vsixFileName}.sha256`),
        `${checksum}  ${vsixFileName}\n`
      );
      fs.writeFileSync(
        path.join('release-evidence', 'release-record.md'),
        [
          '# Release Record',
          '',
          `- Tag: ${tag}`,
          `- Package version: ${version}`,
          `- Commit: ${commitSha}`,
          `- VSIX: release-evidence/${vsixFileName}`,
          `- SHA-256: ${checksum}`,
          '- Evidence retained:',
          '  - release-evidence/coverage/',
          '  - release-evidence/coverage.xml',
          '  - release-evidence/release-manifest.json'
        ].join('\n') + '\n'
      );
      NODE
  artifacts:
    when: always
    expire_in: never
    paths:
      - release-evidence/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
