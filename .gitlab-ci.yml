docs_link_check:
  stage: docs
  image:
    name: lycheeverse/lychee:latest-alpine@sha256:1b2f74f0b6816dc3ee4e5f457d11f1b2ed6c1cf8ebcbaa18cbfe057d5e2ccb00
    entrypoint:
      - ""
  script:
    # GitHub intermittently serves 5xx for generated issue-template forms to
    # anonymous link checkers. Keep the user-facing template links in docs, but
    # avoid treating those GitHub form-generation outages as docs regressions.
    # Private GitLab work items are retained as authority evidence links, but
    # anonymous CI link checks cannot authenticate to that namespace.
    - >
      lychee --verbose --no-progress --include-fragments
      --exclude '^https://github\.com/svelderrainruiz/vi-history-suite/issues/new\?template=.*$'
      --exclude '^https://gitlab\.com/svelderrainruiz/vi-history-suite/-/work_items/.*$'
      README.md docs/**/*.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

