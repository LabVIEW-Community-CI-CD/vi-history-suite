vagrant_windows_vsix_acceptance:
  stage: test
  tags:
    - linux
    - x64
    - virtualbox
    - vagrant
    - private-release
  resource_group: vihs-windows-vagrant
  timeout: 2 hours
  needs:
    - vagrant_runner_admission
  variables:
    VIHS_VAGRANT_BOX: vihs/win11-labview2026
    VIHS_VAGRANT_GOLDEN_VM_NAME: vihs-win11-labview2026-golden
    VIHS_VAGRANT_CI_VM_NAME: vihs-ci-win11
    VIHS_VAGRANT_STORAGE_ROOT: /run/media/sergio/Data/vihs-vagrant
    VIHS_VAGRANT_STANDBY_ROOT: /run/media/sergio/Data1/vihs-vagrant
    VIHS_EVIDENCE_ARCHIVE_ROOT: "/run/media/sergio/MAJOR GENER/VI History Suite Evidence"
    VIHS_VAGRANT_VI_SERVER_TIMEOUT_SEC: "60"
    VAGRANT_HOME: /home/sergio/.vagrant.d
    VIHS_VAGRANT_BOX_CACHE_HOME: /run/media/sergio/Data/vihs-vagrant/vagrant-home
    VIHS_VAGRANT_BOX_FILE: /run/media/sergio/Data/vihs-vagrant/box-cache/windows11.box
    VIHS_VAGRANT_BOX_WORKDIR: /run/media/sergio/Data/vihs-vagrant/box-work
    VIHS_VIRTUALBOX_MACHINE_FOLDER: "/run/media/sergio/Data/vihs-vagrant/VirtualBox VMs"
    VAGRANT_DOTFILE_PATH: .vagrant-ci
  script:
    - set -euo pipefail
    - rm -f ./*.vsix
    - mkdir -p vagrant/shared vagrant/evidence
    - npm run vagrant:acceptance:freshness -- --evidence-dir vagrant/evidence/pipeline-freshness --settle-ms 5000 --api-timeout-ms 10000
    - if [ -f vagrant/evidence/pipeline-freshness/skip-vagrant-acceptance ]; then echo "Skipping stale Vagrant acceptance pipeline before VM boot."; exit 0; fi
    - node scripts/doctorVagrantStorage.js --active-root "${VIHS_VAGRANT_STORAGE_ROOT}" --standby-root "${VIHS_VAGRANT_STANDBY_ROOT}" --archive-root "${VIHS_EVIDENCE_ARCHIVE_ROOT}" --evidence-dir vagrant/evidence --fail-on-active-drift
    - mkdir -p "${VAGRANT_HOME}" "${VIHS_VAGRANT_BOX_CACHE_HOME}" "$(dirname "${VIHS_VAGRANT_BOX_FILE}")" "${VIHS_VAGRANT_BOX_WORKDIR}" "${VIHS_VIRTUALBOX_MACHINE_FOLDER}"
    - bash scripts/vagrant/prepare-vagrant-home.sh
    - VBoxManage setproperty machinefolder "${VIHS_VIRTUALBOX_MACHINE_FOLDER}"
    - bash scripts/vagrant/cleanup-disposable-ci-vm.sh
    - rm -rf vagrant/.vagrant
    - npm ci
    - npm run compile
    - npm run package:audit
    - node scripts/runPinnedVsce.js package
    - |
      vsix_path="$(find . -maxdepth 1 -type f -name '*.vsix' -printf '%T@ %p\n' | sort -nr | awk 'NR == 1 {print $2}')"
      if [ -z "${vsix_path}" ]; then
        echo "No packaged .vsix found after node scripts/runPinnedVsce.js package." >&2
        exit 1
      fi
      cp "${vsix_path}" vagrant/shared/
      echo "Staged VSIX for Vagrant acceptance: ${vsix_path}"
    - |
      if [ "${VIHS_VAGRANT_REFRESH_GOLDEN_BOX:-false}" = "true" ]; then
        bash scripts/vagrant/refresh-golden-box.sh 2>&1 | tee vagrant/evidence/refresh-golden-box.log
      else
        echo "Skipping golden box refresh. Set VIHS_VAGRANT_REFRESH_GOLDEN_BOX=true for operator-controlled refresh."
      fi
    - bash scripts/vagrant/doctor-vagrant-host.sh 2>&1 | tee vagrant/evidence/vagrant-host-doctor.log
    - (cd vagrant && vagrant up --no-provision)
    - (cd vagrant && vagrant provision --provision-with bootstrap)
    - (cd vagrant && vagrant reload --no-provision)
    - (cd vagrant && vagrant provision --provision-with cold-labview 2>&1 | tee evidence/labview-cold-prep.log)
    - (cd vagrant && vagrant provision --provision-with acceptance 2>&1 | tee evidence/acceptance-provision.log)
    - npm run vagrant:acceptance:assert -- --receipt-dir vagrant/evidence/assertion
  after_script:
    - (cd vagrant && vagrant halt --force) || true
    - node scripts/printLatestVagrantAcceptanceManifest.js --evidence-root vagrant/evidence || true
  artifacts:
    when: always
    expire_in: never
    paths:
      - vagrant/evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

package_extension_preview:
  stage: package
  image: node:24
  needs:
    - assurance_release_gate
    - assurance_26514_authority
    - assurance_requirements_quality
    - assurance_external_user_information
    - test_extension
    - linux_docker_provider_lane
    - vagrant_windows_vsix_acceptance
    # - windows_installed_user_host_acceptance is the optional host-only
    #   installed-user proof lane. windows_private_release_acceptance remains
    #   the stricter aggregate host+container lane.
    - job: windows_private_release_acceptance
      optional: true
    - job: windows_installed_user_host_acceptance
      optional: true
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - export PUBLIC_GITHUB_WIKI_BRANCH="${VIHS_PUBLIC_GITHUB_WIKI_BRANCH:-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-${CI_DEFAULT_BRANCH}}}}"
    - git clone --branch "${PUBLIC_GITHUB_WIKI_BRANCH}" "https://github.com/svelderrainruiz/vi-history-suite.wiki.git" ../vi-history-suite.github.wiki || git clone "https://github.com/svelderrainruiz/vi-history-suite.wiki.git" ../vi-history-suite.github.wiki
    - npm ci
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - mkdir -p preview-evidence
    - npm run compile
    - VIHS_PUBLIC_GITHUB_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.github.wiki" VIHS_LEDGER_PATH="${CI_PROJECT_DIR}/docs/product/public-github-wiki-publication-ledger.json" npm run package -- --out "preview-evidence/${PACKAGE_NAME}-${PACKAGE_VERSION}.vsix"
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const path = require('node:path');
      const pkg = require('./package.json');
      const vsixFileName = `${pkg.name}-${pkg.version}.vsix`;
      const manifest = {
        shipId: 'SHIP-0001',
        ref: process.env.CI_COMMIT_REF_NAME || '',
        commitSha: process.env.CI_COMMIT_SHA || '',
        packageVersion: pkg.version,
        previewVsix: {
          fileName: vsixFileName,
          path: `preview-evidence/${vsixFileName}`
        }
      };
      fs.writeFileSync(
        path.join('preview-evidence', 'preview-manifest.json'),
        `${JSON.stringify(manifest, null, 2)}\n`
      );
      NODE
  artifacts:
    when: always
    paths:
      - preview-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^hotfix\/.+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

release_extension:
  stage: release
  image: node:24
  needs:
    - assurance_release_gate
    - assurance_26514_authority
    - assurance_requirements_quality
    - assurance_external_user_information
    - test_extension
    - linux_docker_provider_lane
    - vagrant_windows_vsix_acceptance
    # - windows_installed_user_host_acceptance is the optional host-only
    #   installed-user proof lane. windows_private_release_acceptance remains
    #   the stricter aggregate host+container lane.
    - job: windows_private_release_acceptance
      optional: true
    - job: windows_installed_user_host_acceptance
      optional: true
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" ../vi-history-suite.wiki
    - export PUBLIC_GITHUB_WIKI_BRANCH="${VIHS_PUBLIC_GITHUB_WIKI_BRANCH:-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-${CI_DEFAULT_BRANCH}}}}"
    - git clone --branch "${PUBLIC_GITHUB_WIKI_BRANCH}" "https://github.com/svelderrainruiz/vi-history-suite.wiki.git" ../vi-history-suite.github.wiki || git clone "https://github.com/svelderrainruiz/vi-history-suite.wiki.git" ../vi-history-suite.github.wiki
    - export VIHS_INTERNAL_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.wiki"
    - npm ci
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - |
      if [ "v${PACKAGE_VERSION}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package version ${PACKAGE_VERSION}" >&2
        exit 1
      fi
    - npm run compile
    - npm run test
    - mkdir -p release-evidence
    - cp -R coverage release-evidence/coverage
    - cp coverage/cobertura-coverage.xml release-evidence/coverage.xml
    - VIHS_PUBLIC_GITHUB_WIKI_REPO_ROOT="${CI_PROJECT_DIR}/../vi-history-suite.github.wiki" VIHS_LEDGER_PATH="${CI_PROJECT_DIR}/docs/product/public-github-wiki-publication-ledger.json" npm run package -- --out "release-evidence/${PACKAGE_NAME}-${PACKAGE_VERSION}.vsix"
    - |
      node - <<'NODE'
      const crypto = require('node:crypto');
      const fs = require('node:fs');
      const path = require('node:path');

      const pkg = require('./package.json');
      const tag = process.env.CI_COMMIT_TAG || '';
      const commitSha = process.env.CI_COMMIT_SHA || '';
      const version = pkg.version;
      const vsixFileName = `${pkg.name}-${version}.vsix`;
      const vsixPath = path.join('release-evidence', vsixFileName);
      const manifestPath = path.join('release-evidence', 'release-manifest.json');
      const checksum = crypto
        .createHash('sha256')
        .update(fs.readFileSync(vsixPath))
        .digest('hex');

      const manifest = {
        shipId: 'SHIP-0001',
        tag,
        packageVersion: version,
        commitSha,
        vsixArtifact: {
          fileName: vsixFileName,
          path: vsixPath,
          sha256: checksum
        },
        retainedEvidence: [
          'release-evidence/coverage/',
          'release-evidence/coverage.xml',
          'release-evidence/release-record.md',
          'release-evidence/release-manifest.json'
        ]
      };

      fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
      fs.writeFileSync(
        path.join('release-evidence', `${vsixFileName}.sha256`),
        `${checksum}  ${vsixFileName}\n`
      );
      fs.writeFileSync(
        path.join('release-evidence', 'release-record.md'),
        [
          '# Release Record',
          '',
          `- Tag: ${tag}`,
          `- Package version: ${version}`,
          `- Commit: ${commitSha}`,
          `- VSIX: release-evidence/${vsixFileName}`,
          `- SHA-256: ${checksum}`,
          '- Evidence retained:',
          '  - release-evidence/coverage/',
          '  - release-evidence/coverage.xml',
          '  - release-evidence/release-manifest.json'
        ].join('\n') + '\n'
      );
      NODE
  artifacts:
    when: always
    expire_in: never
    paths:
      - release-evidence/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
