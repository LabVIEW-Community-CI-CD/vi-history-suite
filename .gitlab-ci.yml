stages:
  - admission
  - docs
  - assurance
  - test
  - image
  - package
  - release

governed_runner_admission:
  stage: admission
  tags:
    - windows
    - x64
    - labview-host
    - docker-windows
    - private-release
  script:
    - $ErrorActionPreference = 'Stop'
    - npm ci
    - $npmCommand = (Get-Command npm -ErrorAction Stop).Source
    - $nodeDirectory = Split-Path -Parent $npmCommand
    - if (-not (Test-Path (Join-Path $nodeDirectory 'node.exe'))) { throw "Unable to locate node.exe adjacent to npm at $npmCommand" }
    - $env:PATH = "$nodeDirectory;$env:PATH"
    - npm run gitlab:runner:doctor -- --surface all --fail-on-drift --evidence-dir governed-runner-admission-evidence
  artifacts:
    when: always
    expire_in: never
    paths:
      - governed-runner-admission-evidence/
  rules:
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_COMMIT_BRANCH == "develop"'
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_COMMIT_BRANCH =~ /^hotfix\/.+$/'
    - if: '$VIHS_WINDOWS_LABVIEW_PROOF_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

ubuntu_docker_runner_admission:
  stage: admission
  tags:
    - linux
    - x64
    - docker
    - assurance
    - private-release
  script:
    - mkdir -p governed-runner-admission-evidence
    - gitlab-runner --version | tee governed-runner-admission-evidence/gitlab-runner-version.txt
    - docker info --format '{{.OSType}} {{.ServerVersion}}' | tee governed-runner-admission-evidence/docker-info.txt
    - test "$(docker info --format '{{.OSType}}')" = "linux"
    - node --version | tee governed-runner-admission-evidence/node-version.txt
    - npm --version | tee governed-runner-admission-evidence/npm-version.txt
    - |
      node - <<'NODE'
      const fs = require('node:fs');
      const path = require('node:path');

      const evidenceDir = 'governed-runner-admission-evidence';
      const read = (fileName) => fs.readFileSync(path.join(evidenceDir, fileName), 'utf8').trim();
      const dockerInfo = read('docker-info.txt').split(/\s+/u);
      const payload = {
        schema: 'vi-history-suite/ubuntu-docker-runner-admission@v3',
        claimScope: 'linux-docker-validated-preview',
        generatedAt: new Date().toISOString(),
        runnerDescription: process.env.CI_RUNNER_DESCRIPTION || '',
        runnerTags: (process.env.CI_RUNNER_TAGS || '').split(',').map((tag) => tag.trim()).filter(Boolean),
        commitSha: process.env.CI_COMMIT_SHA || '',
        sourceBranch: process.env.CI_MERGE_REQUEST_SOURCE_BRANCH_NAME || process.env.CI_COMMIT_BRANCH || '',
        targetBranch: process.env.CI_MERGE_REQUEST_TARGET_BRANCH_NAME || '',
        dockerOstype: dockerInfo[0] || '',
        dockerServerVersion: dockerInfo[1] || '',
        nodeVersion: read('node-version.txt'),
        npmVersion: read('npm-version.txt'),
        windowsLabviewProofIncluded: false,
        windowsInstalledUserHostProofState: 'admitted-separate-release-claim-ledger',
        windowsInstalledUserProofDeferred: false,
        windowsDockerDesktopProofState: 'blocked-not-admitted',
        windowsLabviewProofRequiredForPreview: false,
        windowsLabviewProofRequiredForWindowsClaim: false,
        windowsDockerDesktopProofRequiredForWindowsDockerClaim: true,
        releaseClaimLedger: 'docs/product/windows-installed-user-release-claim-ledger-2026-05-14.json'
      };
      fs.writeFileSync(path.join(evidenceDir, 'ubuntu-docker-runner-admission.json'), `${JSON.stringify(payload, null, 2)}\n`);
      fs.writeFileSync(
        path.join(evidenceDir, 'ubuntu-docker-runner-admission.md'),
        [
          '# Ubuntu/Docker Runner Admission',
          '',
          `- Generated at: ${payload.generatedAt}`,
          `- Runner: ${payload.runnerDescription}`,
          `- Docker: ${payload.dockerOstype} ${payload.dockerServerVersion}`,
          `- Node: ${payload.nodeVersion}`,
          `- npm: ${payload.npmVersion}`,
          '- Claim scope: Linux/Docker validated preview',
          '- Windows/LabVIEW proof included: false',
          '- Windows installed-user host proof state: admitted-separate-release-claim-ledger',
          '- Windows installed-user proof deferred: false',
          '- Windows Docker Desktop proof state: blocked-not-admitted',
          '- Windows/LabVIEW proof required for this preview: false',
          '- Windows/LabVIEW proof required before Windows installed-user claim: false',
          '- Windows Docker Desktop proof required before Windows Docker claim: true',
          `- Release claim ledger: ${payload.releaseClaimLedger}`
        ].join('\n') + '\n'
      );
      NODE
  artifacts:
    when: always
    expire_in: never
    paths:
      - governed-runner-admission-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

